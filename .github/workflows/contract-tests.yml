name: contract-tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  contract-tests:
    # Backstop so a hung case can never run the job to the platform's 24h ceiling
    # (the suite has historically timed out). Each shard runs ~1/4 of the cases.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Windows is intentionally not in the matrix yet: the CLI's POSIX process
        # layer (<sys/wait.h>) does not compile on msys2/CLANG64, and the README
        # scopes supported hosts to Linux + macOS. The msys2 steps below are kept
        # dormant for when the subprocess layer is ported and Windows is re-added.
        os: [ubuntu-latest, macos-13, macos-14]
        shard: [1, 2, 3, 4]
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            binary: build/nebula
            shell_kind: unix
          - os: macos-13
            target: darwin-x86_64
            binary: build/nebula
            shell_kind: unix
          - os: macos-14
            target: darwin-arm64
            binary: build/nebula
            shell_kind: unix

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Python
        if: matrix.shell_kind == 'unix'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Validate TLS Root Bundle Metadata
        if: matrix.shell_kind == 'unix'
        run: python3 scripts/sync_tls_root_bundle.py --check

      - name: Setup MSYS2
        if: matrix.shell_kind == 'msys2'
        uses: msys2/setup-msys2@e9898307ac31d1a803454791be09ab9973336e1c # v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-python

      - name: Validate TLS Root Bundle Metadata (MSYS2)
        if: matrix.shell_kind == 'msys2'
        shell: msys2 {0}
        run: python3 scripts/sync_tls_root_bundle.py --check

      - name: Configure
        if: matrix.shell_kind == 'unix'
        run: cmake -S . -B build -DNEBULA_STRICT=ON -DNEBULA_WERROR=ON

      - name: Build
        if: matrix.shell_kind == 'unix'
        run: cmake --build build -j

      - name: Run Contract Tests
        if: matrix.shell_kind == 'unix'
        run: |
          python3 tests/run.py --suite all --report text --binary ${{ matrix.binary }} \
            --shard ${{ matrix.shard }}/4 \
            --text-out contract-tests.txt \
            --junit-out contract-tests.junit.xml \
            --json-out contract-tests.json

      - name: Configure (MSYS2)
        if: matrix.shell_kind == 'msys2'
        shell: msys2 {0}
        run: cmake -S . -B build -G Ninja -DNEBULA_STRICT=ON -DNEBULA_WERROR=ON

      - name: Build (MSYS2)
        if: matrix.shell_kind == 'msys2'
        shell: msys2 {0}
        run: cmake --build build -j

      - name: Run Contract Tests (MSYS2)
        if: matrix.shell_kind == 'msys2'
        shell: msys2 {0}
        run: |
          python3 tests/run.py --suite all --report text --binary ${{ matrix.binary }} \
            --shard ${{ matrix.shard }}/4 \
            --text-out contract-tests.txt \
            --junit-out contract-tests.junit.xml \
            --json-out contract-tests.json

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contract-test-reports-${{ matrix.target }}-shard${{ matrix.shard }}
          path: |
            contract-tests.txt
            contract-tests.junit.xml
            contract-tests.json

  asan-ubsan-test-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Configure
        run: cmake -S . -B build -DNEBULA_STRICT=ON -DNEBULA_WERROR=ON

      - name: Build
        run: cmake --build build -j

      - name: Run Sanitized Test Harness Smoke
        run: |
          smoke_root="$(mktemp -d "${RUNNER_TEMP:-/tmp}/nebula-sanitizer-smoke.XXXXXX")"
          cp tests/fixtures/smoke.nb "$smoke_root/smoke.nb"
          ./build/nebula test --dir "$smoke_root"

  compiler-crash-diagnostic:
    # The CI crashes (rc=-11/245) are the `nebula` COMPILER segfaulting while
    # building certain inputs (result `?`, nested JSON) — not the generated
    # programs. It reproduces only with the CI toolchain (GCC on ubuntu), not
    # locally (clang, incl. ASan). Build the compiler with ASan+UBSan and also
    # run it under gdb on the crashing inputs to locate the fault. Non-blocking.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install gdb
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gdb

      - name: Build compiler with ASan+UBSan
        run: |
          cmake -S . -B build-asan -DNEBULA_STRICT=OFF \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g"
          cmake --build build-asan -j

      - name: Run sanitized compiler on crashing inputs
        run: |
          set +e
          mkdir -p diag
          for fx in result_try_run std_json_arrays_nested smoke; do
            echo "::group::asan $fx"
            ASAN_OPTIONS=detect_leaks=0:abort_on_error=0 UBSAN_OPTIONS=print_stacktrace=1 \
              ./build-asan/nebula build "tests/fixtures/$fx.nb" --emit-cpp --out-dir diag \
              2>&1 | tee "diag/$fx.asan.log"
            echo "[$fx] exit=${PIPESTATUS[0]}"
            echo "::endgroup::"
          done

      - name: Build plain compiler and capture gdb backtrace of the crash
        run: |
          set +e
          cmake -S . -B build -DNEBULA_STRICT=ON -DNEBULA_WERROR=ON && cmake --build build -j
          for fx in result_try_run std_json_arrays_nested; do
            echo "::group::gdb $fx"
            gdb -batch -ex 'run' -ex 'bt full' -ex 'info registers' \
              --args ./build/nebula build "tests/fixtures/$fx.nb" --emit-cpp --out-dir diag \
              2>&1 | tee "diag/$fx.gdb.log"
            echo "::endgroup::"
          done

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compiler-crash-diagnostic
          path: diag/*.log

  linux-backend-ga-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Validate TLS Root Bundle Metadata
        run: python3 scripts/sync_tls_root_bundle.py --check

      - name: Configure
        run: cmake -S . -B build -DNEBULA_STRICT=ON -DNEBULA_WERROR=ON

      - name: Build
        run: cmake --build build -j

      - name: Run Mainline A Focused Regressions
        run: |
          for case in \
            TST-039-install-prefix-binary-smoke \
            TST-041-release-helpers-render-metadata \
            TST-161-release-signoff-helper \
            TST-172-new-backend-service-template-smoke \
            TST-173-install-prefix-backend-sdk-opt-in-smoke \
            TST-174-lsp-extended-features-smoke \
            TST-175-explain-async-metadata-smoke \
            TST-176-reverse-proxy-backend-service-smoke \
            TST-177-lsp-local-references-shadowing-smoke \
            TST-178-lsp-local-callable-references-smoke \
            TST-203-std-runtime-wrapper-contract \
            TST-204-std-http-json-bytes-wrapper-smoke \
            TST-205-official-service-link-smoke \
            TST-206-hosted-registry-missing-python-diagnostic
          do
            python3 tests/run.py --suite test --filter "$case" --binary build/nebula
          done

      - name: Package Linux Release Assets
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          python3 scripts/package_release.py --binary build/nebula --target linux-x86_64 --output-dir dist
          python3 scripts/package_release.py --binary build/nebula --target linux-x86_64 --output-dir dist --include-backend-sdk
          test -f "dist/nebula-v${version}-linux-x86_64.tar.gz"
          test -f "dist/nebula-backend-sdk-v${version}-linux-x86_64.tar.gz"

      - name: Verify Linux Backend GA Hardening
        run: bash scripts/verify_linux_backend_ga_hardening.sh --binary build/nebula --dist-dir dist

  contract-failure-diagnostic:
    # Several vendored official/* smokes (crypto, pqc, qcomm) and the heavy
    # release-control-plane workspace smokes fail only on the CI toolchain
    # (ubuntu/gcc) while passing locally (macOS/clang). The contract harness only
    # reports "step N: expected rc=0, got rc=1"; this non-blocking job re-runs
    # those cases with --keep-temp and re-executes the underlying nebula
    # build/run with FULL output so the real compiler/runtime error surfaces in
    # the log and the emitted C++ is uploaded. Non-blocking.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Configure
        run: cmake -S . -B build -DNEBULA_STRICT=ON -DNEBULA_WERROR=ON

      - name: Build
        run: cmake --build build -j

      - name: Diagnose contract failures with full output
        run: bash scripts/contract_failure_diagnostic.sh build/nebula

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contract-failure-diagnostic
          path: diag/**
