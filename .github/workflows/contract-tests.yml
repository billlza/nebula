name: contract-tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  contract-tests:
    # Backstop so a hung case can never run the job to the platform's 24h ceiling
    # (the suite has historically timed out). Each shard runs ~1/4 of the cases.
    # 50 (not 40) leaves headroom for the shard carrying the heavy
    # release-control-plane workspace smokes (each rebuilds the vendored crypto
    # native C and can take several minutes on a loaded runner).
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, macos-15, windows-2022]
        shard: [1, 2, 3, 4]
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            binary: build/nebula
            shell_kind: unix
          - os: macos-15-intel
            target: darwin-x86_64
            binary: build/nebula
            shell_kind: unix
          - os: macos-15
            target: darwin-arm64
            binary: build/nebula
            shell_kind: unix
          - os: windows-2022
            target: windows-x86_64
            binary: build/nebula.exe
            shell_kind: msys2

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Python
        if: matrix.shell_kind == 'unix'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Prepare lease-capable freestanding LLVM
        if: matrix.shell_kind == 'unix'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            brew list --versions llvm >/dev/null 2>&1 || brew install llvm
            root="$(brew --prefix llvm)"
          else
            source_compiler="$(command -v clang++)"
            root="$RUNNER_TEMP/nebula-freestanding-llvm"
            rm -rf "$root"
            install -d -m 700 "$root/bin"
            cp -L -- "$source_compiler" "$root/bin/clang++"
            chmod 700 "$root/bin/clang++"
          fi
          root="$(NEBULA_FREESTANDING_TOOLCHAIN_ROOT="$root" \
            sh tests/lib/resolve_freestanding_toolchain_root.sh --probe-capabilities)"
          printf 'NEBULA_FREESTANDING_TOOLCHAIN_ROOT=%s\n' "$root" >> "$GITHUB_ENV"

      - name: Validate TLS Root Bundle Metadata
        if: matrix.shell_kind == 'unix'
        run: python3 scripts/sync_tls_root_bundle.py --check

      - name: Setup MSYS2
        if: matrix.shell_kind == 'msys2'
        uses: msys2/setup-msys2@e9898307ac31d1a803454791be09ab9973336e1c # v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-python

      - name: Validate TLS Root Bundle Metadata (MSYS2)
        if: matrix.shell_kind == 'msys2'
        shell: msys2 {0}
        run: python3 scripts/sync_tls_root_bundle.py --check

      - name: Configure
        if: matrix.shell_kind == 'unix'
        run: cmake -S . -B build -DNEBULA_STRICT=ON -DNEBULA_WERROR=ON

      - name: Build
        if: matrix.shell_kind == 'unix'
        run: cmake --build build -j

      - name: Run C++ Tests
        if: matrix.shell_kind == 'unix' && matrix.shard == 1
        run: ctest --test-dir build --output-on-failure -E '^nebula-contract-tests$'

      - name: Run Contract Tests
        if: matrix.shell_kind == 'unix'
        run: |
          # 600s per-step (vs the 120s default): the CI runner is markedly slower
          # than dev machines at rebuilding the vendored crypto native C that the
          # release-control-plane / app-platform smokes pull in, so the default
          # tripped rc=124 timeouts. The 50min job ceiling is the real hang
          # backstop; cases that genuinely need a tighter bound set their own.
          python3 tests/run.py --suite all --report text --binary ${{ matrix.binary }} \
            --shard ${{ matrix.shard }}/4 \
            --timeout 600 \
            --text-out contract-tests.txt \
            --junit-out contract-tests.junit.xml \
            --json-out contract-tests.json

      - name: Configure (MSYS2)
        if: matrix.shell_kind == 'msys2'
        shell: msys2 {0}
        run: cmake -S . -B build -G Ninja -DNEBULA_STRICT=ON -DNEBULA_WERROR=ON

      - name: Build (MSYS2)
        if: matrix.shell_kind == 'msys2'
        shell: msys2 {0}
        run: cmake --build build -j

      - name: Run C++ Tests (MSYS2)
        if: matrix.shell_kind == 'msys2' && matrix.shard == 1
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure -E '^nebula-contract-tests$'

      - name: Run Contract Tests (MSYS2)
        if: matrix.shell_kind == 'msys2'
        shell: msys2 {0}
        run: |
          python3 tests/run.py --suite all --report text --binary ${{ matrix.binary }} \
            --shard ${{ matrix.shard }}/4 \
            --timeout 600 \
            --text-out contract-tests.txt \
            --junit-out contract-tests.junit.xml \
            --json-out contract-tests.json

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contract-test-reports-${{ matrix.target }}-shard${{ matrix.shard }}
          path: |
            contract-tests.txt
            contract-tests.junit.xml
            contract-tests.json

  windows-python-containment:
    name: Windows Python containment probes
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Setup MSYS2 Bash
        uses: msys2/setup-msys2@e9898307ac31d1a803454791be09ab9973336e1c # v2
        with:
          msystem: MSYS
          update: false
          path-type: inherit

      - name: Run Windows Python containment probes
        shell: pwsh
        run: |
          $reportRoot = Join-Path $PWD "windows-python-probe-reports"
          New-Item -ItemType Directory -Force -Path $reportRoot | Out-Null

          $python = (& python -c "import sys; print(sys.executable)").Trim()
          if (-not (Test-Path -LiteralPath $python)) {
            throw "setup-python executable was not found: $python"
          }

          $bashDirectory = "C:\msys64\usr\bin"
          $bash = Join-Path $bashDirectory "bash.exe"
          if (-not (Test-Path -LiteralPath $bash -PathType Leaf)) {
            throw "MSYS2 bash.exe was not found at the pinned path: $bash"
          }
          $env:PATH = "$bashDirectory;$env:PATH"
          $resolvedBash = (Get-Command bash.exe -ErrorAction Stop).Source
          $resolvedBashPath = [IO.Path]::GetFullPath($resolvedBash)
          $expectedBashPath = [IO.Path]::GetFullPath($bash)
          if (-not [StringComparer]::OrdinalIgnoreCase.Equals($resolvedBashPath, $expectedBashPath)) {
            throw "unexpected bash.exe resolved from PATH: $resolvedBash"
          }

          $failed = $false
          $caseIds = @(
            "TST-281-runner-timeout-kills-process-group",
            "TST-340-service-probe-partial-record-contract"
          )
          foreach ($caseId in $caseIds) {
            $reportBase = Join-Path $reportRoot $caseId
            $probeArgs = @(
              "tests/run.py",
              "--suite", "test",
              "--filter", $caseId,
              "--binary", $python,
              "--timeout", "30",
              "--report", "text",
              "--text-out", "${reportBase}.txt",
              "--json-out", "${reportBase}.json",
              "--junit-out", "${reportBase}.junit.xml"
            )
            & $python @probeArgs
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error title=Windows Python containment probe failed::$caseId exited with code $LASTEXITCODE"
              $failed = $true
            }
          }
          if ($failed) {
            exit 1
          }

      - name: Upload Windows Python probe reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-python-containment-reports
          path: windows-python-probe-reports
          if-no-files-found: error
          retention-days: 7

  asan-ubsan-test-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Configure Strict ASan and UBSan Build
        run: |
          cmake -S . -B build-sanitize \
            -DCMAKE_BUILD_TYPE=Debug \
            -DNEBULA_STRICT=ON \
            -DNEBULA_WERROR=ON \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build Instrumented Compiler and Lifecycle Tests
        run: |
          cmake --build build-sanitize --parallel --target \
            nebula \
            nebula-freestanding-toolchain-signal-tests \
            nebula-freestanding-transaction-tests \
            nebula-host-process-tests \
            nebula-compiler-process-containment-tests \
            nebula-termination-signal-tests \
            nebula-verified-executable-lease-tests

      - name: Run Sanitized Test Harness Smoke
        run: |
          set -euo pipefail
          smoke_root="$(mktemp -d "${RUNNER_TEMP:-/tmp}/nebula-sanitizer-smoke.XXXXXX")"
          trap 'rm -rf "$smoke_root"' EXIT
          cp tests/fixtures/smoke.nb "$smoke_root/smoke.nb"
          ./build-sanitize/nebula test --dir "$smoke_root"

      - name: Run Sanitized Freestanding Lifecycle Tests
        run: |
          ctest --test-dir build-sanitize --output-on-failure \
            -R '^(nebula-freestanding-toolchain-signal-tests|nebula-freestanding-transaction-tests|nebula-host-process-tests|nebula-compiler-process-containment-tests|nebula-termination-signal-tests|nebula-verified-executable-lease-tests)$'

  compiler-crash-diagnostic:
    # The CI crashes (rc=-11/245) are the `nebula` COMPILER segfaulting while
    # building certain inputs (result `?`, nested JSON) — not the generated
    # programs. It reproduces only with the CI toolchain (GCC on ubuntu), not
    # locally (clang, incl. ASan). Build the compiler with ASan+UBSan and also
    # run it under gdb on the crashing inputs to locate the fault. Non-blocking.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install gdb
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gdb

      - name: Build compiler with ASan+UBSan
        run: |
          cmake -S . -B build-asan -DNEBULA_STRICT=OFF \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g"
          cmake --build build-asan -j

      - name: Run sanitized compiler on crashing inputs
        run: |
          set +e
          mkdir -p diag
          for fx in result_try_run std_json_arrays_nested smoke; do
            echo "::group::asan $fx"
            ASAN_OPTIONS=detect_leaks=0:abort_on_error=0 UBSAN_OPTIONS=print_stacktrace=1 \
              ./build-asan/nebula build "tests/fixtures/$fx.nb" --emit-cpp --out-dir diag \
              2>&1 | tee "diag/$fx.asan.log"
            echo "[$fx] exit=${PIPESTATUS[0]}"
            echo "::endgroup::"
          done

      - name: Build plain compiler and capture gdb backtrace of the crash
        run: |
          set +e
          cmake -S . -B build -DNEBULA_STRICT=ON -DNEBULA_WERROR=ON && cmake --build build -j
          for fx in result_try_run std_json_arrays_nested; do
            echo "::group::gdb $fx"
            gdb -batch -ex 'run' -ex 'bt full' -ex 'info registers' \
              --args ./build/nebula build "tests/fixtures/$fx.nb" --emit-cpp --out-dir diag \
              2>&1 | tee "diag/$fx.gdb.log"
            echo "::endgroup::"
          done

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compiler-crash-diagnostic
          path: diag/*.log

  linux-backend-ga-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Validate TLS Root Bundle Metadata
        run: python3 scripts/sync_tls_root_bundle.py --check

      - name: Configure
        run: cmake -S . -B build -DNEBULA_STRICT=ON -DNEBULA_WERROR=ON

      - name: Build
        run: cmake --build build -j

      - name: Run Mainline A Focused Regressions
        run: |
          for case in \
            TST-039-install-prefix-binary-smoke \
            TST-041-release-helpers-render-metadata \
            TST-161-release-signoff-helper \
            TST-172-new-backend-service-template-smoke \
            TST-173-install-prefix-backend-sdk-opt-in-smoke \
            TST-174-lsp-extended-features-smoke \
            TST-175-explain-async-metadata-smoke \
            TST-176-reverse-proxy-backend-service-smoke \
            TST-177-lsp-local-references-shadowing-smoke \
            TST-178-lsp-local-callable-references-smoke \
            TST-203-std-runtime-wrapper-contract \
            TST-204-std-http-json-bytes-wrapper-smoke \
            TST-205-official-service-link-smoke \
            TST-206-hosted-registry-missing-python-diagnostic
          do
            python3 tests/run.py --suite test --filter "$case" --binary build/nebula
          done

      - name: Package Linux Release Assets
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          python3 scripts/package_release.py --binary build/nebula --target linux-x86_64 --output-dir dist
          python3 scripts/package_release.py --binary build/nebula --target linux-x86_64 --output-dir dist --include-backend-sdk
          test -f "dist/nebula-v${version}-linux-x86_64.tar.gz"
          test -f "dist/nebula-backend-sdk-v${version}-linux-x86_64.tar.gz"

      - name: Verify Linux Backend GA Hardening
        run: bash scripts/verify_linux_backend_ga_hardening.sh --binary build/nebula --dist-dir dist

  contract-failure-diagnostic:
    # Several vendored official/* smokes (crypto, pqc, qcomm) and the heavy
    # release-control-plane workspace smokes fail only on the CI toolchain
    # (ubuntu/gcc) while passing locally (macOS/clang). The contract harness only
    # reports "step N: expected rc=0, got rc=1"; this non-blocking job re-runs
    # those cases with --keep-temp and re-executes the underlying nebula
    # build/run with FULL output so the real compiler/runtime error surfaces in
    # the log and the emitted C++ is uploaded. Non-blocking.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Configure
        run: cmake -S . -B build -DNEBULA_STRICT=ON -DNEBULA_WERROR=ON

      - name: Build
        run: cmake --build build -j

      - name: Diagnose contract failures with full output
        run: bash scripts/contract_failure_diagnostic.sh build/nebula

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contract-failure-diagnostic
          path: diag/**
