id = "BLD-017-freestanding-object-elf-contract"
suite = "build"

[[steps]]
kind = "shell"
run = '''
set -eu
case "$(uname -s)" in
  MINGW*|MSYS*|CYGWIN*)
    mkdir -p work/freestanding-object-windows
    set +e
    "$NEBULA_BINARY" build "$NEBULA_REPO_ROOT/tests/fixtures/freestanding_entry.nb" \
      --emit freestanding-object --target x86_64-unknown-none --panic trap \
      --freestanding-toolchain-root "$NEBULA_REPO_ROOT" \
      --diag-format json --out-dir work/freestanding-object-windows \
      >work/freestanding-object-windows/build.log 2>&1
    rc=$?
    set -e
    test "$rc" -ne 0
    grep -F '"code":"NBL-CLI-FS-HOST-UNSUPPORTED"' \
      work/freestanding-object-windows/build.log
    test ! -e work/freestanding-object-windows/freestanding_entry.o
    echo freestanding-object-contract-ok
    exit 0
    ;;
esac
root="work/freestanding-object-contract"
rm -rf "$root"
mkdir -p "$root"
toolchain_root=$(sh "$NEBULA_REPO_ROOT/tests/lib/resolve_freestanding_toolchain_root.sh")
"$NEBULA_BINARY" build "$NEBULA_REPO_ROOT/tests/fixtures/freestanding_entry.nb" \
  --emit freestanding-object \
  --target x86_64-unknown-none \
  --panic trap \
  --freestanding-toolchain-root "$toolchain_root" \
  --out-dir "$root" >"$root/build.log" 2>&1

obj="$root/freestanding_entry.o"
src="$root/freestanding_entry.freestanding.cpp"
meta="$obj.nebmeta"
test -f "$obj"
test -f "$src"
test -f "$meta"
test ! -e "$root/freestanding_entry.out"
! grep -E '#include|std::|nebula::rt|(^|[[:space:]])throw([[:space:]]|$)|(^|[[:space:]])new([[:space:]]|$)' "$src"
grep -F 'target=x86_64-unknown-none panic_policy=trap' "$src"
grep -F '__builtin_add_overflow(lhs, rhs, &result)' "$src"
grep -F '__builtin_sub_overflow(lhs, rhs, &result)' "$src"
grep -F '__builtin_mul_overflow(lhs, rhs, &result)' "$src"
test "$(grep -Fc 'if (rhs == 0 || (lhs == __nebula_i64_min && rhs == -1)) __builtin_trap();' "$src")" -eq 2
grep -F 'static bool __nebula_fn_' "$src"
grep -F 'bool __nebula_v_' "$src"
grep -F 'artifact_kind=freestanding-object' "$meta"
grep -F 'runtime_profile=system' "$meta"
grep -F 'no_std=1' "$meta"
grep -F 'strict_region=1' "$meta"
grep -F 'target=x86_64-unknown-none' "$meta"
grep -F 'panic_policy=trap' "$meta"
! grep -i 'warning:' "$root/build.log"

python3 - "$obj" "$meta" <<'PY'
import hashlib
import struct
import sys
from pathlib import Path

obj = Path(sys.argv[1])
meta_path = Path(sys.argv[2])
data = obj.read_bytes()
assert data[:7] == b"\x7fELF\x02\x01\x01"
e_type, e_machine, e_version = struct.unpack_from("<HHI", data, 16)
e_entry, e_phoff, e_shoff = struct.unpack_from("<QQQ", data, 24)
e_flags, e_ehsize, e_phentsize, e_phnum, e_shentsize, e_shnum, e_shstrndx = \
    struct.unpack_from("<IHHHHHH", data, 48)
assert (e_type, e_machine, e_version) == (1, 62, 1)
assert (e_entry, e_phoff, e_phentsize, e_phnum, e_flags, e_ehsize) == (0, 0, 0, 0, 0, 64)
assert e_shentsize == 64 and 0 < e_shnum < 4096 and 0 < e_shstrndx < e_shnum
assert e_shoff <= len(data) and e_shnum <= (len(data) - e_shoff) // e_shentsize

sections = [struct.unpack_from("<IIQQQQIIQQ", data, e_shoff + i * 64) for i in range(e_shnum)]
shstr = sections[e_shstrndx]
assert shstr[1] == 3
shstr_data = data[shstr[4]:shstr[4] + shstr[5]]

def cstr(blob: bytes, offset: int) -> str:
    end = blob.index(b"\0", offset)
    return blob[offset:end].decode("ascii")

names = [cstr(shstr_data, section[0]) for section in sections]
for forbidden in {
    ".dynamic", ".dynsym", ".interp", ".eh_frame", ".gcc_except_table",
    ".init_array", ".fini_array", ".preinit_array", ".tdata", ".tbss",
}:
    assert forbidden not in names

symtabs = [(i, section) for i, section in enumerate(sections) if section[1] == 2]
assert len(symtabs) == 1
_, symtab = symtabs[0]
assert symtab[9] == 24 and symtab[5] % 24 == 0
strtab = sections[symtab[6]]
strings = data[strtab[4]:strtab[4] + strtab[5]]
undefined = []
global_symbols = []
for index in range(symtab[5] // 24):
    base = symtab[4] + index * 24
    st_name, st_info, st_other, st_shndx, st_value, st_size = struct.unpack_from("<IBBHQQ", data, base)
    name = cstr(strings, st_name)
    if index and st_shndx == 0:
        undefined.append(name)
    if index and (st_info >> 4) in (1, 2):
        global_symbols.append((name, st_info & 0x0F, st_other & 0x03, st_shndx, st_size))
assert undefined == []
assert len(global_symbols) == 1
name, kind, visibility, section_index, size = global_symbols[0]
assert name == "__nebula_uos_payload_entry_v1" and kind == 2 and visibility == 0 and section_index != 0 and size > 0

meta_lines = meta_path.read_text(encoding="ascii").splitlines()
assert len(meta_lines) == 15 and meta_lines[0] == "version=6"
meta = dict(line.split("=", 1) for line in meta_lines)
assert len(meta["build_inputs_sha256"]) == 64
assert set(meta["build_inputs_sha256"]) <= set("0123456789abcdef")
assert int(meta["artifact_size"]) == len(data)
assert meta["artifact_sha256"] == hashlib.sha256(data).hexdigest()
print("elf-audit-ok")
PY

test -z "$(find "$root" -maxdepth 1 -type d -name '.nebula-fs-*' -print -quit)"
cat "$root/build.log"
echo freestanding-object-contract-ok
'''
expect_rc = 0
expect_stdout_contains = ["freestanding-object-contract-ok"]
