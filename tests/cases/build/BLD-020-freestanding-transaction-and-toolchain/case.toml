from __future__ import annotations

import os
from pathlib import Path
import shlex
import signal
import subprocess
import sys
import time


binary, source, root_value, shell, sleep = sys.argv[1:]
root = Path(root_value).resolve()


def process_state(pid: int) -> str | None:
    result = subprocess.run(
        ["ps", "-o", "state=", "-p", str(pid)],
        check=False,
        capture_output=True,
        text=True,
        timeout=2,
    )
    if result.returncode != 0:
        return None
    state = result.stdout.strip()
    return state or None


def wait_for_process_cleanup(pid: int, role: str) -> None:
    deadline = time.monotonic() + 5.0
    while time.monotonic() < deadline:
        state = process_state(pid)
        if state is None or state.startswith("Z"):
            return
        time.sleep(0.02)
    raise AssertionError(f"{role} process {pid} survived compiler interruption")


def read_pid(path: Path, role: str) -> int:
    value = int(path.read_text(encoding="utf-8"))
    if value <= 1:
        raise AssertionError(f"invalid {role} pid {value}")
    return value


def run_query_signal_case(name: str, escape_capture_writer: bool) -> None:
    fake = root / f"fake-query-{name}"
    script = fake / "bin" / "clang++"
    script.parent.mkdir(parents=True)
    ready = fake / "ready"
    leader_path = fake / "leader.pid"
    escaped_path = fake / "escaped.pid"
    output = root / f"query-{name}.o"
    log_path = root / f"query-{name}.log"

    script_body = (
        f"#!{sys.executable}\n"
        "from pathlib import Path\n"
        "import os\n"
        "import subprocess\n"
        "import sys\n"
        "import time\n"
        "if sys.argv[1:] != ['--version']:\n"
        "    raise SystemExit(99)\n"
        f"Path({str(leader_path)!r}).write_text(str(os.getpid()), encoding='utf-8')\n"
    )
    if escape_capture_writer:
        script_body += (
            f"child = subprocess.Popen([{sleep!r}, '30'], start_new_session=True)\n"
            f"Path({str(escaped_path)!r}).write_text(str(child.pid), encoding='utf-8')\n"
        )
    script_body += f"Path({str(ready)!r}).touch()\n"
    script_body += "raise SystemExit(0)\n" if escape_capture_writer else "time.sleep(30)\n"
    script.write_text(script_body, encoding="utf-8")
    script.chmod(0o755)

    arguments = [
        binary,
        "build",
        source,
        "--emit",
        "freestanding-object",
        "--target",
        "x86_64-unknown-none",
        "--panic",
        "trap",
        "--mode",
        "release",
        "--freestanding-toolchain-root",
        str(fake),
        "-o",
        str(output),
    ]
    process: subprocess.Popen[bytes] | None = None
    leader_pid: int | None = None
    escaped_pid: int | None = None
    try:
        with log_path.open("wb") as log:
            process = subprocess.Popen(
                arguments,
                env=os.environ.copy(),
                stdout=log,
                stderr=log,
                start_new_session=True,
            )
            ready_deadline = time.monotonic() + 5.0
            while not ready.exists() and time.monotonic() < ready_deadline:
                if process.poll() is not None:
                    raise AssertionError(
                        f"Nebula exited before the {name} query fixture became ready"
                    )
                time.sleep(0.01)
            if not ready.exists():
                raise AssertionError(f"{name} query fixture did not become ready")

            leader_pid = read_pid(leader_path, "query compiler leader")
            if not escape_capture_writer and os.getpgid(leader_pid) != leader_pid:
                raise AssertionError("query compiler does not own its containment group")
            if escape_capture_writer:
                escaped_pid = read_pid(escaped_path, "escaped query capture writer")
                if os.getpgid(escaped_pid) != escaped_pid or os.getsid(escaped_pid) != escaped_pid:
                    raise AssertionError("query capture writer did not enter its isolated session")

            if not escape_capture_writer:
                process.send_signal(signal.SIGTERM)
            try:
                return_code = process.wait(timeout=12)
            except subprocess.TimeoutExpired as error:
                raise AssertionError(f"Nebula did not finish the {name} query cleanup") from error

        log_text = log_path.read_text(encoding="utf-8")
        if escape_capture_writer:
            if return_code != 125:
                raise AssertionError(
                    f"unconfirmed query returned {return_code}; expected infrastructure rc125"
                )
            if "POSIX capture pipes did not close after process-group quiescence" not in log_text:
                raise AssertionError("unconfirmed query omitted its containment root cause")
            if "caller termination signal redelivery is disabled because" not in log_text:
                raise AssertionError("unconfirmed query omitted its redelivery suppression reason")
        else:
            if return_code != -signal.SIGTERM:
                raise AssertionError(
                    f"confirmed query returned {return_code}; expected {-signal.SIGTERM}"
                )
            if "freestanding toolchain resolution was interrupted by signal 15" not in log_text:
                raise AssertionError("confirmed query omitted its signal handoff diagnostic")

        wait_for_process_cleanup(leader_pid, "query compiler leader")
        if output.exists() or Path(str(output) + ".nebmeta").exists():
            raise AssertionError(f"{name} interrupted query published an output")
        if list((fake / "bin").glob(".nebula-exec-*")):
            raise AssertionError(f"{name} interrupted query left a compiler snapshot")
    finally:
        cleanup_errors: list[str] = []
        active_exception = sys.exception()
        if process is not None and process.poll() is None:
            try:
                os.killpg(process.pid, signal.SIGKILL)
            except ProcessLookupError:
                pass
            except OSError as error:
                cleanup_errors.append(f"query test-session kill failed: {error}")
            try:
                process.wait(timeout=5)
            except subprocess.TimeoutExpired:
                cleanup_errors.append("query test-session reap timed out")
        if escaped_pid is not None:
            state = process_state(escaped_pid)
            if state is not None and not state.startswith("Z"):
                try:
                    if os.getpgid(escaped_pid) != escaped_pid or os.getsid(escaped_pid) != escaped_pid:
                        cleanup_errors.append(
                            "refused to signal an escaped query writer whose identity changed"
                        )
                    else:
                        os.killpg(escaped_pid, signal.SIGKILL)
                        wait_for_process_cleanup(escaped_pid, "escaped query capture writer")
                except ProcessLookupError:
                    pass
                except OSError as error:
                    cleanup_errors.append(f"escaped query writer cleanup failed: {error}")
        if cleanup_errors:
            cleanup_message = "; ".join(cleanup_errors)
            if active_exception is not None:
                active_exception.add_note(cleanup_message)
            else:
                raise AssertionError(cleanup_message)


run_query_signal_case("unconfirmed-suppressed", escape_capture_writer=True)
run_query_signal_case("confirmed-redelivered", escape_capture_writer=False)


for signal_number, signal_name in (
    (signal.SIGINT, "sigint"),
    (signal.SIGTERM, "sigterm"),
):
    fake = root / f"fake-parent-{signal_name}"
    fake.mkdir()
    script = fake / "bin" / "clang++"
    script.parent.mkdir()
    ready = fake / "ready"
    leader_path = fake / "leader.pid"
    child_path = fake / "child.pid"
    output = root / f"parent-{signal_name}.o"
    log_path = root / f"parent-{signal_name}.log"
    child_command = "trap '' HUP INT QUIT TERM; exec " + shlex.quote(sleep) + " 30"
    script.write_text(
        "#!/bin/sh\n"
        "if [ \"$#\" -eq 1 ] && [ \"$1\" = '--version' ]; then "
        "printf '%s\\n' 'Nebula signal clang 1.0'; exit 0; fi\n"
        "for argument in \"$@\"; do\n"
        "  if [ \"$argument\" = '-dumpmachine' ]; then "
        "printf '%s\\n' 'x86_64-unknown-none'; exit 0; fi\n"
        "  if [ \"$argument\" = '-fsyntax-only' ]; then exit 0; fi\n"
        "done\n"
        "trap '' HUP INT QUIT TERM\n"
        + shlex.quote(shell)
        + " -c "
        + shlex.quote(child_command)
        + " &\n"
        + "child=$!\n"
        + "printf '%s' \"$$\" > "
        + shlex.quote(str(leader_path))
        + "\n"
        + "printf '%s' \"$child\" > "
        + shlex.quote(str(child_path))
        + "\n"
        + ": > "
        + shlex.quote(str(ready))
        + "\n"
        + "wait \"$child\"\n",
        encoding="utf-8",
    )
    script.chmod(0o755)

    environment = os.environ.copy()
    environment["PATH"] = str(fake) + os.pathsep + environment["PATH"]
    arguments = [
        binary,
        "build",
        source,
        "--emit",
        "freestanding-object",
        "--target",
        "x86_64-unknown-none",
        "--panic",
        "trap",
        "--mode",
        "release",
        "--freestanding-toolchain-root",
        str(fake),
        "-o",
        str(output),
    ]

    process: subprocess.Popen[bytes] | None = None
    recorded_pids: list[int] = []
    try:
        with log_path.open("wb") as log:
            process = subprocess.Popen(
                arguments,
                env=environment,
                stdout=log,
                stderr=log,
                start_new_session=True,
            )
            ready_deadline = time.monotonic() + 5.0
            while not ready.exists() and time.monotonic() < ready_deadline:
                if process.poll() is not None:
                    raise AssertionError(
                        f"Nebula exited before {signal_name} compiler fixture became ready"
                    )
                time.sleep(0.01)
            if not ready.exists():
                raise AssertionError(f"{signal_name} compiler fixture did not become ready")

            leader_pid = read_pid(leader_path, "compiler leader")
            child_pid = read_pid(child_path, "compiler descendant")
            recorded_pids.extend((leader_pid, child_pid))
            if os.getpgid(leader_pid) != leader_pid:
                raise AssertionError("compiler fixture leader does not own its process group")
            if os.getpgid(child_pid) != leader_pid:
                raise AssertionError("compiler fixture descendant escaped the owned process group")
            if os.getsid(leader_pid) != process.pid or os.getsid(child_pid) != process.pid:
                raise AssertionError("compiler fixture escaped the isolated Nebula test session")
            process.send_signal(signal_number)
            try:
                return_code = process.wait(timeout=10)
            except subprocess.TimeoutExpired as error:
                raise AssertionError(
                    f"Nebula did not finish {signal_name} cleanup within 10 seconds"
                ) from error

        if return_code != -signal_number:
            raise AssertionError(
                f"Nebula returned {return_code} after {signal_name}; expected {-signal_number}"
            )
        log_text = log_path.read_text(encoding="utf-8")
        expected_log = f"compiler execution interrupted by signal {signal_number} after process-group cleanup"
        if expected_log not in log_text:
            raise AssertionError(f"missing {signal_name} cleanup diagnostic")
        wait_for_process_cleanup(leader_pid, "compiler leader")
        wait_for_process_cleanup(child_pid, "compiler descendant")
        for unpublished in (
            output,
            Path(str(output) + ".nebmeta"),
            output.with_suffix(".freestanding.cpp"),
        ):
            if unpublished.exists() or unpublished.is_symlink():
                raise AssertionError(f"interrupted build published {unpublished}")
        if any(path.is_dir() for path in root.rglob(".nebula-fs-*")):
            raise AssertionError("interrupted build left a freestanding staging directory")
    finally:
        cleanup_errors: list[str] = []
        active_exception = sys.exception()
        if process is not None and process.poll() is None:
            try:
                os.killpg(process.pid, signal.SIGKILL)
            except ProcessLookupError:
                pass
            except OSError as error:
                cleanup_errors.append(f"Nebula test-session kill failed: {error}")
            try:
                process.wait(timeout=5)
            except subprocess.TimeoutExpired:
                cleanup_errors.append("Nebula test-session reap timed out")
        if process is not None:
            leader_candidate: int | None = recorded_pids[0] if recorded_pids else None
            if leader_candidate is None and leader_path.exists():
                try:
                    parsed_leader = int(leader_path.read_text(encoding="utf-8"))
                    if parsed_leader > 1:
                        leader_candidate = parsed_leader
                    else:
                        cleanup_errors.append(
                            f"compiler leader identity was invalid: {parsed_leader}"
                        )
                except (OSError, UnicodeError, ValueError) as error:
                    cleanup_errors.append(f"compiler leader identity read failed: {error}")
            descendant_candidates = list(recorded_pids[1:])
            if child_path.exists():
                try:
                    parsed_child = int(child_path.read_text(encoding="utf-8"))
                    if parsed_child > 1 and parsed_child not in descendant_candidates:
                        descendant_candidates.append(parsed_child)
                    elif parsed_child <= 1:
                        cleanup_errors.append(
                            f"compiler descendant identity was invalid: {parsed_child}"
                        )
                except (OSError, UnicodeError, ValueError) as error:
                    cleanup_errors.append(f"compiler descendant identity read failed: {error}")
            leader_state = (
                process_state(leader_candidate) if leader_candidate is not None else None
            )
            if leader_candidate is not None and leader_state is not None:
                expected_session = process.pid
                try:
                    first_group = os.getpgid(leader_candidate)
                    candidate_session = os.getsid(leader_candidate)
                    second_group = os.getpgid(leader_candidate)
                    if (
                        first_group != leader_candidate
                        or second_group != leader_candidate
                        or candidate_session != expected_session
                    ):
                        cleanup_errors.append(
                            "refused to signal a compiler fixture whose leader identity changed"
                        )
                    else:
                        os.killpg(leader_candidate, signal.SIGKILL)
                except ProcessLookupError:
                    pass
                except OSError as error:
                    cleanup_errors.append(f"compiler fixture group cleanup failed: {error}")
            else:
                descendant_without_anchor = False
                for pid in descendant_candidates:
                    state = process_state(pid)
                    if state is not None and not state.startswith("Z"):
                        descendant_without_anchor = True
                        break
                if descendant_without_anchor:
                    cleanup_errors.append(
                        "compiler descendant remained without a live group-leader identity anchor"
                    )
        if cleanup_errors:
            cleanup_message = "; ".join(cleanup_errors)
            if active_exception is not None:
                active_exception.add_note(cleanup_message)
            else:
                raise AssertionError(cleanup_message)
PY

