id = "BLD-013-system-no-std-smoke-build-policy-markers"
suite = "build"

[[steps]]
kind = "shell"
run = '''
set -eu
root="work/system-no-std-smoke-matrix"
rm -rf "$root"

build_smoke() {
  target="$1"
  panic="$2"
  out="$root/$target-$panic"
  "$NEBULA_BINARY" build "$NEBULA_REPO_ROOT/examples/system_no_std_smoke" \
    --target "$target" --no-std --panic "$panic" --out-dir "$out"
  test -f "$out/main.cpp"
  test -f "$out/main.out"
  test -f "$out/main.out.nebmeta"
  grep -F '#include "runtime/nebula_runtime.hpp"' "$out/main.cpp"
  grep -F "nebula-codegen-profile runtime_profile=system target=$target panic_policy=$panic" "$out/main.cpp"
  grep -F 'NEBULA_RUNTIME_PROFILE = "system"' "$out/main.cpp"
  grep -F "NEBULA_TARGET = \"$target\"" "$out/main.cpp"
  grep -F "NEBULA_PANIC_POLICY = \"$panic\"" "$out/main.cpp"
  grep -F 'runtime_profile=system' "$out/main.out.nebmeta"
  grep -F "target=$target" "$out/main.out.nebmeta"
  grep -F "panic_policy=$panic" "$out/main.out.nebmeta"
  grep -F 'strict_region=1' "$out/main.out.nebmeta"
  grep -F 'no_std=1' "$out/main.out.nebmeta"
}

build_smoke system abort
build_smoke system trap
build_smoke freestanding abort
build_smoke freestanding trap
build_smoke x86_64-unknown-none abort
build_smoke x86_64-unknown-none trap
'''
expect_rc = 0
expect_stdout_contains = [
  "runtime_profile=system target=system panic_policy=abort",
  "runtime_profile=system target=system panic_policy=trap",
  "runtime_profile=system target=freestanding panic_policy=abort",
  "runtime_profile=system target=freestanding panic_policy=trap",
  "runtime_profile=system target=x86_64-unknown-none panic_policy=abort",
  "runtime_profile=system target=x86_64-unknown-none panic_policy=trap",
  "NEBULA_PANIC_POLICY = \"abort\"",
  "NEBULA_PANIC_POLICY = \"trap\"",
]
