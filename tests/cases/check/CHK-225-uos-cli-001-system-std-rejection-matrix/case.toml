id = "CHK-225-uos-cli-001-system-std-rejection-matrix"
suite = "check"
timeout = 60

[[steps]]
kind = "shell"
run = '''
"$NEBULA_BINARY" check "$NEBULA_TESTS_ROOT/fixtures/system_forbidden_std.nb" \
  --target system --diag-format json
'''
expect_rc = 1
expect_stdout_contains = ["hosted bundled std is unavailable in the system/no-std profile"]

[[steps.expect_diag]]
code = "NBL-CLI-SYSTEM-STD"
severity = "error"
stage = "build"
category = "cli"

