kind = "shell"
run = '''
"$NEBULA_BINARY" check "$NEBULA_TESTS_ROOT/fixtures/uos_cli_002_region_escape.nb" \
  --target freestanding --diag-format json
'''
expect_rc = 1
expect_stdout_contains = ["region escape rejected in strict mode"]
forbid_stdout_contains = ["auto-promoted"]

[[steps.expect_diag]]
