id = "TST-210-example-cli-service-workspace-reverse-proxy-smoke"
suite = "test"

[[steps]]
kind = "shell"
run = '''
python3 - <<'PY'
import json
import os
import sys
import threading
from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
from pathlib import Path

repo_root = Path(os.environ['NEBULA_REPO_ROOT'])
sys.path.insert(0, str(repo_root / 'tests' / 'lib'))
from cli_service_workspace import (
    copy_example,
    fetch_workspace,
    nebula,
    print_completed,
    require_success,
    run_ctl,
    start_service,
    terminate_process,
    wait_until_health_ok,
)

binary = os.environ['NEBULA_BINARY']
root = Path('work/example_cli_service_workspace_proxy')
ctl_out_dir = root / '.ctl-out'
copy_example(repo_root, root)
fetch_workspace(binary, root)

ctl_build = nebula(
    binary,
    'build',
    root / 'apps' / 'ctl',
    '--out-dir',
    ctl_out_dir,
)
require_success(ctl_build, 'ctl prebuild')

proc, service_output, port = start_service(binary, root)
wait_until_health_ok(proc, service_output, port)


class Proxy(BaseHTTPRequestHandler):
    def _forward(self, method: str) -> None:
        if not self.path.startswith('/api'):
            self.send_response(404)
            self.end_headers()
            return
        upstream_path = self.path[len('/api'):]
        if upstream_path == '':
            upstream_path = '/'
        body = None
        if method == 'POST':
            length = int(self.headers.get('Content-Length', '0'))
            body = self.rfile.read(length)
        import http.client
        conn = http.client.HTTPConnection('127.0.0.1', port, timeout=5)
        try:
            headers = {key: value for key, value in self.headers.items()}
            conn.request(method, upstream_path, body=body, headers=headers)
            response = conn.getresponse()
            payload = response.read()
            self.send_response(response.status)
            for key, value in response.getheaders():
                if key.lower() == 'transfer-encoding':
                    continue
                self.send_header(key, value)
            self.end_headers()
            self.wfile.write(payload)
        finally:
            conn.close()

    def do_GET(self) -> None:
        self._forward('GET')

    def do_POST(self) -> None:
        self._forward('POST')

    def log_message(self, format: str, *args) -> None:
        return


server = ThreadingHTTPServer(('127.0.0.1', 0), Proxy)
proxy_port = server.server_address[1]
thread = threading.Thread(target=server.serve_forever, daemon=True)
thread.start()
try:
    proxied_base = f'http://127.0.0.1:{proxy_port}/api/'

    status_result = run_ctl(
        binary,
        root,
        'status',
        '--json',
        '--url',
        proxied_base,
        out_dir=ctl_out_dir,
        no_build=True,
    )
    require_success(status_result, 'proxied ctl status --json')
    status_payload = json.loads(status_result.stdout)
    if (
        status_payload.get('base_url') != f'http://127.0.0.1:{proxy_port}/api'
        or status_payload.get('ok') is not True
    ):
        print_completed(status_result)
        raise SystemExit(f'unexpected proxied ctl status payload: {status_payload!r}')

    info_result = run_ctl(
        binary,
        root,
        'info',
        '--url',
        proxied_base,
        out_dir=ctl_out_dir,
        no_build=True,
    )
    require_success(info_result, 'proxied ctl info')
    if 'service=cli-service-skeleton' not in info_result.stdout:
        print_completed(info_result)
        raise SystemExit('proxied ctl info did not render the service contract')

    ping_result = run_ctl(
        binary,
        root,
        'ping',
        'proxy',
        '--json',
        '--url',
        proxied_base,
        out_dir=ctl_out_dir,
        no_build=True,
    )
    require_success(ping_result, 'proxied ctl ping --json')
    ping_payload = json.loads(ping_result.stdout)
    if (
        ping_payload.get('message') != 'proxy'
        or ping_payload.get('service') != 'cli-service-skeleton'
    ):
        print_completed(ping_result)
        raise SystemExit(f'unexpected proxied ctl ping payload: {ping_payload!r}')

    print('example-cli-service-workspace-proxy-ok')
finally:
    server.shutdown()
    server.server_close()
    thread.join(timeout=5)
    terminate_process(proc, service_output)
    if thread.is_alive():
        raise RuntimeError('reverse proxy thread did not stop')
PY
'''
expect_rc = 0
expect_stdout_contains = ["example-cli-service-workspace-proxy-ok"]
