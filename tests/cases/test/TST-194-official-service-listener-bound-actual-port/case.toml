id = "TST-194-official-service-listener-bound-actual-port"
suite = "test"

[[steps]]
kind = "shell"
run = "python3 - <<'PY'\nimport os\nimport shutil\nimport socket\nimport subprocess\nimport sys\nfrom pathlib import Path\n\nrepo_root = Path(os.environ['NEBULA_REPO_ROOT'])\nsys.path.insert(0, str(repo_root / 'tests' / 'lib'))\nfrom service_probe import collect_observe_events, finish_process_output, start_process, terminate_process, wait_for_listener_bound\nroot = Path('work/official_service_listener_bound_actual_port')\nshutil.rmtree(root, ignore_errors=True)\n(root / 'src').mkdir(parents=True, exist_ok=True)\n(root / 'nebula.toml').write_text('''schema_version = 1\\n\\n[package]\\nname = \"official-service-listener-bound-actual-port\"\\nversion = \"0.1.0\"\\nentry = \"src/main.nb\"\\nsrc_dir = \"src\"\\n\\n[dependencies]\\nservice = { path = \"''' + str(repo_root / 'official' / 'nebula-service') + '''\" }\\n''', encoding='utf-8')\n(root / 'src' / 'server.nb').write_text('''module server\\nimport service::context\\nimport std::http\\nimport std::result\\n\\nasync fn handle_request(ctx: RequestContext, request: Request) -> Result<Response, String> {\\n  return Ok(ok_text(\"bound\"))\\n}\\n''', encoding='utf-8')\n(root / 'src' / 'main.nb').write_text('''module main\\nimport service::config\\nimport service::server\\nimport server\\n\\nasync fn main() -> Void {\\n  match config_from_env(\"svc-listener-bound\", 0) {\\n    Ok(cfg) => {\\n      match await bind_listener(cfg) {\\n        Ok(listener) => {\\n          match await serve_requests_n_result_with_context(listener, cfg, 1, handle_request) {\\n            Ok(_) => {}\\n            Err(msg) => { print(msg) }\\n          }\\n        }\\n        Err(msg) => { print(msg) }\\n      }\\n    }\\n    Err(msg) => { print(msg) }\\n  }\\n}\\n''', encoding='utf-8')\nsubprocess.run([os.environ['NEBULA_BINARY'], 'update', str(root)], check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)\nproc, service_output = start_process([\n    os.environ['NEBULA_BINARY'], 'run', str(root), '--run-gate', 'none'\n], 'listener_bound', env={**os.environ, 'NEBULA_BIND_HOST': '127.0.0.1', 'NEBULA_PORT': '0'})\nclient = None\ntry:\n    _, actual_port = wait_for_listener_bound(\n        proc, service_output, timeout=90.0\n    )\n    client = socket.create_connection(('127.0.0.1', actual_port), timeout=2)\n    client.settimeout(2)\n    client.sendall(b'GET /hello HTTP/1.1\\r\\nHost: localhost\\r\\nContent-Length: 0\\r\\n\\r\\n')\n    response = b''\n    while True:\n        chunk = client.recv(4096)\n        if not chunk:\n            break\n        response += chunk\n    if b'200 OK' not in response or not response.endswith(b'bound'):\n        raise SystemExit(f'unexpected bound response: {response!r}')\n    proc.wait(timeout=10)\n    stdout, stderr = finish_process_output(proc, service_output)\n    print(stdout, end='')\n    print(stderr, end='')\n    if proc.returncode != 0:\n        raise SystemExit(proc.returncode)\n    observe_events = collect_observe_events(stderr)\n    bound_events = [item for item in observe_events if item.get('event') == 'listener_bound']\n    if len(bound_events) != 1:\n        raise SystemExit(f'expected one listener_bound event: {observe_events!r}')\n    event = bound_events[0]\n    if event.get('bind_host') != '127.0.0.1':\n        raise SystemExit(f'unexpected bind_host in listener_bound: {event!r}')\n    if event.get('port') != actual_port:\n        raise SystemExit(f'listener_bound port mismatch: actual_port={actual_port!r}, event={event!r}')\n    print('service-listener-bound-actual-port-ok')\nfinally:\n    if client is not None:\n        client.close()\n    terminate_process(proc, service_output)\nPY\n"
expect_rc = 0
expect_stdout_contains = ["service-listener-bound-actual-port-ok"]
