id = "TST-164-example-hello-api-smoke"
suite = "test"

[[steps]]
kind = "shell"
run = """
python3 - <<'PY'
import http.client
import os
import shutil
import subprocess
import sys
import time
from pathlib import Path

repo_root = Path(os.environ['NEBULA_REPO_ROOT'])
sys.path.insert(0, str(repo_root / 'tests' / 'lib'))
from service_probe import fail_with_output, service_start_timeout, wait_for_listener_bound

root = Path('work/example_hello_api')
shutil.rmtree(root, ignore_errors=True)
shutil.copytree(repo_root / 'examples' / 'hello_api', root)
(root / 'nebula.toml').write_text(f'''schema_version = 1

[package]
name = "hello-api"
version = "0.1.0"
entry = "src/main.nb"
src_dir = "src"

[dependencies]
service = {{ path = "{(repo_root / 'official' / 'nebula-service').resolve()}" }}
''', encoding='utf-8')
subprocess.run([os.environ['NEBULA_BINARY'], 'update', str(root)], check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)

drain_file = root / 'hello-api.draining'
proc = subprocess.Popen(
    [os.environ['NEBULA_BINARY'], 'run', str(root), '--run-gate', 'none'],
    stdout=subprocess.PIPE,
    stderr=subprocess.PIPE,
    text=True,
    env={
        **os.environ,
        'NEBULA_BIND_HOST': '127.0.0.1',
        'NEBULA_PORT': '0',
        'NEBULA_DRAIN_FILE': str(drain_file),
        'NEBULA_DRAIN_POLL_MS': '100',
    },
)
stderr_lines = []
_, port = wait_for_listener_bound(proc, stderr_lines, timeout=30)
try:
    deadline = time.time() + service_start_timeout(20)
    ready = False
    while time.time() < deadline:
        if proc.poll() is not None:
            fail_with_output(proc, stderr_lines, f'hello_api exited before ready: rc={proc.returncode}')
        try:
            conn = http.client.HTTPConnection('127.0.0.1', port, timeout=1)
            conn.request('GET', '/healthz')
            resp = conn.getresponse()
            resp.read()
            conn.close()
            if resp.status == 200:
                ready = True
                break
        except Exception:
            time.sleep(0.1)
    if not ready:
        fail_with_output(proc, stderr_lines, 'hello_api did not become ready')

    conn = http.client.HTTPConnection('127.0.0.1', port, timeout=1)
    conn.request('GET', '/hello/nebula')
    resp = conn.getresponse()
    body = resp.read().decode('utf-8')
    conn.close()
    if resp.status != 200 or body != 'nebula':
        raise SystemExit(f'unexpected hello_api response: {(resp.status, body)!r}')

    drain_file.write_text('drain\\n', encoding='utf-8')
    draining = False
    deadline = time.time() + service_start_timeout(20)
    while time.time() < deadline:
        if proc.poll() is not None:
            fail_with_output(proc, stderr_lines, f'hello_api exited before draining readiness: rc={proc.returncode}')
        try:
            conn = http.client.HTTPConnection('127.0.0.1', port, timeout=1)
            conn.request('GET', '/readyz')
            resp = conn.getresponse()
            resp.read()
            conn.close()
            if resp.status == 503:
                draining = True
                break
        except Exception:
            time.sleep(0.1)
    if not draining:
        fail_with_output(proc, stderr_lines, 'hello_api did not report draining readiness')

    try:
        proc.wait(timeout=service_start_timeout(20))
    except subprocess.TimeoutExpired:
        raise SystemExit('hello_api did not exit after draining quiesced')
    print('example-hello-api-ok')
finally:
    if proc.poll() is None:
        proc.terminate()
        try:
            proc.wait(timeout=5)
        except subprocess.TimeoutExpired:
            proc.kill()
            proc.wait(timeout=5)
PY
"""
expect_rc = 0
expect_stdout_contains = ["example-hello-api-ok"]
