id = "TST-225-official-tls-server-package-smoke"
suite = "test"

[[steps]]
kind = "shell"
run = '''
python3 - <<'PY'
import json
import os
import platform
import shutil
import socket
import ssl
import subprocess
import sys
import time
from pathlib import Path

system = platform.system().lower()
if system.startswith('windows') or system.startswith('msys') or system.startswith('mingw') or system.startswith('cygwin'):
    print('tls-server-package-skip-unsupported-host')
    raise SystemExit(0)
if shutil.which('openssl') is None:
    raise SystemExit('openssl is required for official TLS server package smoke test')

repo_root = Path(os.environ['NEBULA_REPO_ROOT'])
sys.path.insert(0, str(repo_root / 'tests' / 'lib'))
from service_probe import fail_with_output, finish_process_output, start_process, terminate_process

root = Path('work/official_tls_server_package')
app = root / 'app'
artifact_dir = root / 'build'
artifact = artifact_dir / 'tls-server.out'
ready_path = root / 'listener.ready'
if root.is_symlink():
    root.unlink()
elif root.exists():
    shutil.rmtree(root)
(app / 'src').mkdir(parents=True, exist_ok=True)

(root / 'openssl_ca.cnf').write_text("""[req]
distinguished_name = dn
x509_extensions = v3_ca
prompt = no

[dn]
CN = Nebula TLS server package CA

[v3_ca]
subjectKeyIdentifier = hash
authorityKeyIdentifier = keyid:always,issuer
basicConstraints = critical, CA:true
keyUsage = critical, digitalSignature, keyCertSign, cRLSign
""", encoding='utf-8')
(root / 'openssl_server.cnf').write_text("""[req]
distinguished_name = dn
req_extensions = v3_req
prompt = no

[dn]
CN = localhost

[v3_req]
subjectAltName = @alt_names
basicConstraints = CA:false
keyUsage = critical, digitalSignature, keyEncipherment
extendedKeyUsage = serverAuth

[alt_names]
DNS.1 = localhost
IP.1 = 127.0.0.1
""", encoding='utf-8')
subprocess.run([
    'openssl', 'req', '-x509', '-newkey', 'rsa:2048', '-nodes',
    '-keyout', str(root / 'ca.key'),
    '-out', str(root / 'ca.pem'),
    '-days', '2',
    '-config', str(root / 'openssl_ca.cnf'),
], check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
subprocess.run([
    'openssl', 'req', '-newkey', 'rsa:2048', '-nodes',
    '-keyout', str(root / 'server.key'),
    '-out', str(root / 'server.csr'),
    '-config', str(root / 'openssl_server.cnf'),
], check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
subprocess.run([
    'openssl', 'x509', '-req',
    '-in', str(root / 'server.csr'),
    '-CA', str(root / 'ca.pem'),
    '-CAkey', str(root / 'ca.key'),
    '-CAcreateserial',
    '-out', str(root / 'server.pem'),
    '-days', '2',
    '-sha256',
    '-extfile', str(root / 'openssl_server.cnf'),
    '-extensions', 'v3_req',
], check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)

server_cert = (root / 'server.pem').read_text(encoding='utf-8')
server_key = (root / 'server.key').read_text(encoding='utf-8')
server_cert_literal = server_cert.replace('\\', '\\\\').replace('\n', '\\n').replace('"', '\\"')
server_key_literal = server_key.replace('\\', '\\\\').replace('\n', '\\n').replace('"', '\\"')
ready_literal = str(ready_path).replace('\\', '\\\\').replace('"', '\\"')
ca_pem = (root / 'ca.pem').read_text(encoding='utf-8')

(app / 'nebula.toml').write_text(f"""schema_version = 1

[package]
name = "official-tls-server-package-smoke"
version = "0.1.0"
entry = "src/main.nb"
src_dir = "src"

[dependencies]
tlss = {{ path = "{repo_root / 'official' / 'nebula-tls-server'}" }}
""", encoding='utf-8')
source = """module main
import std::fs
import std::http
import std::http_json
import std::json
import std::net
import tlss::server
import tlss::http

async fn main() -> Void {
  match server_identity_from_pem_text("__CERT__", "__KEY__") {
    Ok(identity) => {
      let cfg0 = with_version_policy(server_config(identity), tls12_or_13_policy())
      let cfg1 = with_alpn_policy(cfg0, alpn_none_policy())
      let cfg2 = with_client_auth_policy(cfg1, disabled_client_auth())
      match await bind_host("127.0.0.1", 0, cfg2) {
        Ok(listener) => {
          match TlsListener_local_addr(listener) {
            Ok(bound_addr) => {
              match bound_addr.port() {
                Ok(bound_port) => {
                  match write_string("__READY__", stringify(int_value(bound_port))) {
                    Ok(_) => {}
                    Err(msg) => { print(msg) }
                  }
                }
                Err(msg) => { print(msg) }
              }
            }
            Err(msg) => { print(msg) }
          }
          match await TlsListener_accept(listener) {
            Ok(stream) => {
              match await TlsServerStream_read_request(stream) {
                Ok(request) => {
                  let response = ok_json(object4(
                    "path",
                    string_value(request.path),
                    "peer_present",
                    bool_value(TlsServerStream_peer_present(stream)),
                    "peer_verified",
                    bool_value(TlsServerStream_peer_verified(stream)),
                    "tls_version",
                    string_value(TlsServerStream_tls_version(stream))
                  ))
                  let write_result = await TlsServerStream_write_response_with_connection(stream, response, true)
                  let listener_close = TlsListener_close(listener)
                  match write_result {
                    Ok(_) => {}
                    Err(msg) => { print(msg) }
                  }
                  match listener_close {
                    Ok(_) => {}
                    Err(msg) => { print(msg) }
                  }
                }
                Err(msg) => {
                  print(msg)
                }
              }
            }
            Err(msg) => {
              print(msg)
            }
          }
        }
        Err(msg) => {
          print(msg)
        }
      }
    }
    Err(msg) => {
      print(msg)
    }
  }
}
"""
source = source.replace('__CERT__', server_cert_literal)
source = source.replace('__KEY__', server_key_literal)
source = source.replace('__READY__', ready_literal)
(app / 'src' / 'main.nb').write_text(source, encoding='utf-8')

update = subprocess.run([
    os.environ['NEBULA_BINARY'], 'update', str(app)
], capture_output=True, text=True, env=os.environ.copy())
print(update.stdout, end='')
print(update.stderr, end='')
if update.returncode != 0:
    raise SystemExit(update.returncode)

build = subprocess.run([
    os.environ['NEBULA_BINARY'],
    'build',
    str(app),
    '--out-dir',
    str(artifact_dir),
    '-o',
    str(artifact),
], capture_output=True, text=True, env=os.environ.copy())
print(build.stdout, end='')
print(build.stderr, end='')
if build.returncode != 0:
    raise SystemExit(build.returncode)

proc, service_output = start_process([
    os.environ['NEBULA_BINARY'],
    'run',
    str(app),
    '--no-build',
    '-o',
    str(artifact),
    '--run-gate',
    'none',
], 'tls_server_ready', env=os.environ.copy())
try:
    deadline = time.monotonic() + 30.0
    actual_port = None
    while time.monotonic() < deadline:
        if proc.poll() is not None:
            fail_with_output(
                proc,
                service_output,
                f'tls server app exited before becoming ready: rc={proc.returncode}',
            )
        try:
            candidate = int(ready_path.read_text(encoding='utf-8').strip())
            if 1 <= candidate <= 65535:
                actual_port = candidate
                break
        except (FileNotFoundError, ValueError):
            pass
        time.sleep(0.1)
    if actual_port is None:
        fail_with_output(proc, service_output, 'tls server app never became ready')

    ctx = ssl.SSLContext(ssl.PROTOCOL_TLS_CLIENT)
    ctx.check_hostname = True
    ctx.verify_mode = ssl.CERT_REQUIRED
    ctx.load_verify_locations(cadata=ca_pem)
    with socket.create_connection(('127.0.0.1', actual_port), timeout=10) as raw:
        with ctx.wrap_socket(raw, server_hostname='localhost') as tls_sock:
            request = (
                'GET /hello HTTP/1.1\r\n'
                f'Host: localhost:{actual_port}\r\n'
                'Connection: close\r\n\r\n'
            )
            tls_sock.sendall(request.encode('utf-8'))
            data = b''
            while True:
                chunk = tls_sock.recv(4096)
                if not chunk:
                    break
                data += chunk
    if not data.startswith(b'HTTP/1.1 200 OK\r\n') or b'\r\n\r\n' not in data:
        raise SystemExit(f'unexpected TLS HTTP response: {data!r}')
    body = data.split(b'\r\n\r\n', 1)[1]
    payload = json.loads(body.decode('utf-8'))
    if payload['path'] != '/hello':
        raise SystemExit(f'unexpected path payload: {payload!r}')
    if payload['peer_present'] is not False or payload['peer_verified'] is not False:
        raise SystemExit(f'unexpected peer metadata: {payload!r}')
    if payload['tls_version'] != 'TLSv1.3':
        raise SystemExit(f'unexpected tls_version: {payload!r}')

    try:
        proc.wait(timeout=10)
    except subprocess.TimeoutExpired:
        fail_with_output(proc, service_output, 'tls server did not exit after one response')
    stdout, stderr = finish_process_output(proc, service_output)
    print(stdout, end='')
    print(stderr, end='')
    if proc.returncode != 0:
        raise SystemExit(proc.returncode)
finally:
    terminate_process(proc, service_output)

print('tls-server-package-ok')
PY
'''
expect_rc = 0
