id = "TST-327-thin-host-media-player-native-gate-smoke"
suite = "test"
description = "media player exposes an opt-in libmpv/libtorrent native gate without making default contracts depend on host media libraries"

[[steps]]
kind = "shell"
run = """
python3 - <<'PY'
import json
import os
import subprocess
from pathlib import Path

repo = Path(os.environ["NEBULA_REPO_ROOT"])
script = repo / "scripts" / "verify_thin_host_media_player_native.py"
probe = repo / "examples" / "thin_host_media_player" / "native" / "media_sidecar_probe.cpp"
bundle = json.loads((repo / "examples" / "thin_host_media_player" / "deploy" / "bundle" / "manifest.preview.json").read_text(encoding="utf-8"))
readme = (repo / "examples" / "thin_host_media_player" / "README.md").read_text(encoding="utf-8")
doc = (repo / "docs" / "media_player_validation_app.md").read_text(encoding="utf-8")

if not script.exists():
    raise SystemExit("missing native media verifier")
if not probe.exists():
    raise SystemExit("missing native media sidecar probe")
native = bundle.get("native_sidecars", {})
if native.get("player") != "libmpv-c-api opt-in":
    raise SystemExit(f"bad native player gate: {native!r}")
if native.get("torrent_transport") != "libtorrent-rasterbar-loopback opt-in":
    raise SystemExit(f"bad native torrent gate: {native!r}")
if native.get("required_for_real_media_gate") is not True:
    raise SystemExit(f"native gate is not explicit: {native!r}")
for marker in [
    "verify_thin_host_media_player_native.py",
    "libmpv",
    "libtorrent-rasterbar",
    "fake media pass",
]:
    if marker not in readme:
        raise SystemExit(f"README missing native gate marker: {marker}")
for marker in [
    "opt-in native media proof",
    "libmpv-c-api",
    "libtorrent-rasterbar-loopback",
]:
    if marker not in doc:
        raise SystemExit(f"media player doc missing native gate marker: {marker}")
for marker in [
    "#include <mpv/client.h>",
    "#include <libtorrent/session.hpp>",
    "media-player.native-sidecar-proof.v1",
]:
    if marker not in probe.read_text(encoding="utf-8"):
        raise SystemExit(f"native sidecar probe missing marker: {marker}")

if os.environ.get("NEBULA_MEDIA_PLAYER_NATIVE_GATE") == "1":
    result = subprocess.run(
        ["python3", str(script), "--binary", os.environ["NEBULA_BINARY"], "--out-root", "work/thin_host_media_player_native_gate"],
        cwd=repo,
        capture_output=True,
        text=True,
        check=False,
    )
    if result.returncode != 0:
        raise SystemExit(f"native media gate failed:\\nSTDOUT:\\n{result.stdout}\\nSTDERR:\\n{result.stderr}")
    if "thin-host-media-player-native-ok" not in result.stdout:
        raise SystemExit(f"native media gate did not report success:\\n{result.stdout}")
else:
    result = subprocess.run(
        ["python3", str(script), "--diagnose-deps"],
        cwd=repo,
        capture_output=True,
        text=True,
        check=False,
    )
    if result.returncode != 0:
        raise SystemExit(f"native media dependency diagnosis failed:\\nSTDOUT:\\n{result.stdout}\\nSTDERR:\\n{result.stderr}")
    diag = json.loads(result.stdout)
    if diag.get("schema") != "media-player.native-dependency-diagnostics.v1":
        raise SystemExit(f"bad native dependency diagnostics: {diag!r}")

print("thin-host-media-player-native-gate-ok")
PY
"""
expect_rc = 0
expect_stdout_contains = ["thin-host-media-player-native-gate-ok"]
