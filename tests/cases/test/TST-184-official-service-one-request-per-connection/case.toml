id = "TST-184-official-service-one-request-per-connection"
suite = "test"

[[steps]]
kind = "shell"
run = '''python3 - <<'PY'
import os
import shutil
import socket
import subprocess
import sys
import time
from pathlib import Path

repo_root = Path(os.environ['NEBULA_REPO_ROOT'])
sys.path.insert(0, str(repo_root / 'tests' / 'lib'))
from service_probe import fail_with_output, finish_process_output, wait_for_listener_bound

root = Path('work/official_service_connection_lifecycle')
shutil.rmtree(root, ignore_errors=True)
(root / 'src').mkdir(parents=True, exist_ok=True)
(root / 'nebula.toml').write_text(f"""schema_version = 1

[package]
name = "official-service-connection-lifecycle"
version = "0.1.0"
entry = "src/main.nb"
src_dir = "src"

[dependencies]
service = {{ path = "{repo_root / 'official' / 'nebula-service'}" }}
""", encoding='utf-8')
(root / 'src' / 'server.nb').write_text("""module server
import service::context
import std::http
import std::result

async fn handle_request(ctx: RequestContext, request: Request) -> Result<Response, String> {
  return Ok(ok_text("one-shot"))
}
""", encoding='utf-8')
(root / 'src' / 'main.nb').write_text("""module main
import service::config
import service::server
import server

async fn main() -> Void {
  match config_from_env("svc-connection-lifecycle", 0) {
    Ok(cfg) => {
      match await bind_listener(cfg) {
        Ok(listener) => {
          match await serve_requests_n_result_with_context(listener, cfg, 1, handle_request) {
            Ok(_) => {}
            Err(msg) => { print(msg) }
          }
        }
        Err(msg) => { print(msg) }
      }
    }
    Err(msg) => { print(msg) }
  }
}
""", encoding='utf-8')

subprocess.run([os.environ['NEBULA_BINARY'], 'update', str(root)],
               check=True,
               stdout=subprocess.DEVNULL,
               stderr=subprocess.DEVNULL)
proc = subprocess.Popen([
    os.environ['NEBULA_BINARY'],
    'run',
    str(root),
    '--run-gate',
    'none',
], stdout=subprocess.PIPE,
   stderr=subprocess.PIPE,
   text=True,
   env={**os.environ, 'NEBULA_BIND_HOST': '127.0.0.1', 'NEBULA_PORT': '0'})
stderr_lines = []
_, port = wait_for_listener_bound(proc, stderr_lines, timeout=45.0)
client = None

def read_more(sock: socket.socket, deadline: float, label: str) -> bytes:
    while time.time() < deadline:
        if proc.poll() is not None:
            fail_with_output(proc, stderr_lines, f'connection-lifecycle service exited while reading {label}: rc={proc.returncode}')
        sock.settimeout(max(0.05, min(1.0, deadline - time.time())))
        try:
            chunk = sock.recv(4096)
        except socket.timeout:
            continue
        if not chunk:
            fail_with_output(proc, stderr_lines, f'connection closed before reading {label}')
        return chunk
    fail_with_output(proc, stderr_lines, f'timed out reading {label}')
    raise AssertionError('unreachable')

def read_http_response(sock: socket.socket) -> bytes:
    deadline = time.time() + 15
    data = b''
    while b'\r\n\r\n' not in data:
        data += read_more(sock, deadline, 'response headers')
    header, body = data.split(b'\r\n\r\n', 1)
    content_length = None
    for raw_line in header.split(b'\r\n')[1:]:
        if raw_line.lower().startswith(b'content-length:'):
            content_length = int(raw_line.split(b':', 1)[1].strip())
            break
    if content_length is None:
        fail_with_output(proc, stderr_lines, f'first response missing Content-Length: {data!r}')
    while len(body) < content_length:
        body += read_more(sock, deadline, 'response body')
    return header + b'\r\n\r\n' + body[:content_length]

def wait_for_peer_close(sock: socket.socket) -> bool:
    deadline = time.time() + 20
    while time.time() < deadline:
        sock.settimeout(max(0.05, min(1.0, deadline - time.time())))
        try:
            chunk = sock.recv(1)
        except socket.timeout:
            continue
        except OSError:
            return True
        return chunk == b''
    return False

try:
    deadline = time.time() + 20
    while time.time() < deadline:
        try:
            client = socket.create_connection(('127.0.0.1', port), timeout=1)
            break
        except OSError:
            if proc.poll() is not None:
                fail_with_output(proc, stderr_lines, f'connection-lifecycle service exited before accepting: rc={proc.returncode}')
            time.sleep(0.05)
    if client is None:
        fail_with_output(proc, stderr_lines, 'connection-lifecycle service did not accept a socket in time')

    first = b'GET /hello HTTP/1.1\r\nHost: localhost\r\nContent-Length: 0\r\n\r\n'
    client.sendall(first)
    response = read_http_response(client)
    if b'200 OK' not in response or not response.endswith(b'one-shot'):
        fail_with_output(proc, stderr_lines, f'unexpected first response bytes: {response!r}')
    if not wait_for_peer_close(client):
        fail_with_output(proc, stderr_lines, 'connection remained reusable after first response')

    try:
        proc.wait(timeout=20)
    except subprocess.TimeoutExpired:
        fail_with_output(proc, stderr_lines, 'connection-lifecycle service did not exit after first request')
    stdout, stderr = finish_process_output(proc, stderr_lines)
    print(stdout, end='')
    print(stderr, end='')
    if proc.returncode != 0:
        raise SystemExit(proc.returncode)
    print('service-connection-lifecycle-ok')
finally:
    if client is not None:
        client.close()
    if proc.poll() is None:
        proc.terminate()
        try:
            proc.wait(timeout=5)
        except subprocess.TimeoutExpired:
            proc.kill()
            proc.wait(timeout=5)
PY
'''
expect_rc = 0
expect_stdout_contains = ["service-connection-lifecycle-ok"]
