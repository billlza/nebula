id = "TST-231-official-service-tls-mtls-peer-identity-smoke"
suite = "test"

[[steps]]
kind = "shell"
timeout = 240
run = '''
python3 - <<'PY'
import json
import os
import platform
import shutil
import subprocess
import sys
import time
from pathlib import Path

system = platform.system().lower()
if system.startswith('windows') or system.startswith('msys') or system.startswith('mingw') or system.startswith('cygwin'):
    print('service-tls-mtls-peer-identity-skip-unsupported-host')
    raise SystemExit(0)
if shutil.which('openssl') is None:
    raise SystemExit('openssl is required for official service TLS mTLS peer identity smoke test')

repo_root = Path(os.environ['NEBULA_REPO_ROOT'])
sys.path.insert(0, str(repo_root / 'tests' / 'lib'))
from process_containment import (
    InvocationError,
    ProcessContainmentPolicy,
    run_contained_command,
)
from service_probe import (
    fail_with_output,
    finish_process_output,
    start_process,
    terminate_process,
    wait_for_listener_bound,
)

root = Path('work/official_service_tls_mtls_peer_identity')
server_app = root / 'server_app'
client_app = root / 'client_app'
server_artifact_dir = root / 'server_build'
client_artifact_dir = root / 'client_build'
server_artifact = server_artifact_dir / 'mtls-server.out'
client_artifact = client_artifact_dir / 'mtls-client.out'
ready_path = root / 'server.ready'
if root.is_symlink():
    root.unlink()
elif root.exists():
    shutil.rmtree(root)
(server_app / 'src').mkdir(parents=True, exist_ok=True)
(client_app / 'src').mkdir(parents=True, exist_ok=True)

(root / 'openssl_ca.cnf').write_text("""[req]\ndistinguished_name = dn\nx509_extensions = v3_ca\nprompt = no\n\n[dn]\nCN = Nebula Service mTLS Peer Identity CA\n\n[v3_ca]\nsubjectKeyIdentifier = hash\nauthorityKeyIdentifier = keyid:always,issuer\nbasicConstraints = critical, CA:true\nkeyUsage = critical, digitalSignature, keyCertSign, cRLSign\n""", encoding='utf-8')
(root / 'openssl_server.cnf').write_text("""[req]\ndistinguished_name = dn\nreq_extensions = v3_req\nprompt = no\n\n[dn]\nCN = localhost\n\n[v3_req]\nsubjectAltName = @alt_names\nbasicConstraints = CA:false\nkeyUsage = critical, digitalSignature, keyEncipherment\nextendedKeyUsage = serverAuth\n\n[alt_names]\nDNS.1 = localhost\nIP.1 = 127.0.0.1\n""", encoding='utf-8')
(root / 'openssl_client.cnf').write_text("""[req]\ndistinguished_name = dn\nreq_extensions = v3_req\nprompt = no\n\n[dn]\nCN = nebula-client\n\n[v3_req]\nsubjectAltName = @alt_names\nbasicConstraints = CA:false\nkeyUsage = critical, digitalSignature, keyEncipherment\nextendedKeyUsage = clientAuth\n\n[alt_names]\nDNS.1 = client.local\nemail.1 = client@example.com\nURI.1 = spiffe://nebula/client\nIP.1 = 10.1.2.3\n""", encoding='utf-8')
subprocess.run(['openssl', 'req', '-x509', '-newkey', 'rsa:2048', '-nodes', '-keyout', str(root / 'ca.key'), '-out', str(root / 'ca.pem'), '-days', '2', '-config', str(root / 'openssl_ca.cnf')], check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
subprocess.run(['openssl', 'req', '-newkey', 'rsa:2048', '-nodes', '-keyout', str(root / 'server.key'), '-out', str(root / 'server.csr'), '-config', str(root / 'openssl_server.cnf')], check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
subprocess.run(['openssl', 'x509', '-req', '-in', str(root / 'server.csr'), '-CA', str(root / 'ca.pem'), '-CAkey', str(root / 'ca.key'), '-CAcreateserial', '-out', str(root / 'server.pem'), '-days', '2', '-sha256', '-extfile', str(root / 'openssl_server.cnf'), '-extensions', 'v3_req'], check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
subprocess.run(['openssl', 'req', '-newkey', 'rsa:2048', '-nodes', '-keyout', str(root / 'client.key'), '-out', str(root / 'client.csr'), '-config', str(root / 'openssl_client.cnf')], check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
subprocess.run(['openssl', 'x509', '-req', '-in', str(root / 'client.csr'), '-CA', str(root / 'ca.pem'), '-CAkey', str(root / 'ca.key'), '-CAcreateserial', '-out', str(root / 'client.pem'), '-days', '2', '-sha256', '-extfile', str(root / 'openssl_client.cnf'), '-extensions', 'v3_req'], check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)

server_cert = (root / 'server.pem').read_text(encoding='utf-8')
server_key = (root / 'server.key').read_text(encoding='utf-8')
client_cert = (root / 'client.pem').read_text(encoding='utf-8')
client_key = (root / 'client.key').read_text(encoding='utf-8')
ca_pem = (root / 'ca.pem').read_text(encoding='utf-8')

def lit(text: str) -> str:
    return text.replace('\\', '\\\\').replace('\n', '\\n').replace('"', '\\"')

(server_app / 'nebula.toml').write_text(f"""schema_version = 1\n\n[package]\nname = "official-service-tls-mtls-peer-identity-server-smoke"\nversion = "0.1.0"\nentry = "src/main.nb"\nsrc_dir = "src"\n\n[dependencies]\nservice = {{ path = "{repo_root / 'official' / 'nebula-service'}" }}\ntlss = {{ path = "{repo_root / 'official' / 'nebula-tls-server'}" }}\ntlsc = {{ path = "{repo_root / 'official' / 'nebula-tls'}" }}\n""", encoding='utf-8')
(server_app / 'src' / 'server_handler.nb').write_text("""module server_handler\nimport service::context\nimport service::tls\nimport std::http\nimport std::http_json\nimport std::json\nimport std::result\n\nasync fn handle_request(ctx: RequestContext, request: Request) -> Result<Response, String> {\n  return await authorize_mtls_result(ctx, request, handle_identity)\n}\n\nasync fn handle_identity(ctx: RequestContext, request: Request) -> Result<Response, String> {\n  let subject = ctx.tls_peer_subject()?\n  let fingerprint = ctx.tls_peer_fingerprint_sha256()?\n  let san_claims = ctx.tls_peer_san_claims()?\n  let identity_debug = ctx.tls_peer_identity_debug()\n  match ctx.principal() {\n    Ok(value) => {\n      let scheme = get_string(value.claims, "scheme")?\n      let principal_fingerprint = get_string(value.claims, "tls_peer_fingerprint_sha256")?\n      let principal_san_claims = get_value(value.claims, "tls_peer_san_claims")?\n      let principal_identity_debug = get_value(value.claims, "tls_peer_identity")?\n      return Ok(ok_json(object5(\n        "subject",\n        string_value(subject),\n        "fingerprint_sha256",\n        string_value(fingerprint),\n        "san_claims",\n        san_claims,\n        "identity_debug",\n        identity_debug,\n        "principal",\n        object5(\n          "subject",\n          string_value(value.subject),\n          "scheme",\n          string_value(scheme),\n          "fingerprint_sha256",\n          string_value(principal_fingerprint),\n          "san_claims",\n          principal_san_claims,\n          "identity_debug",\n          principal_identity_debug\n        )\n      )))\n    }\n    Err(msg) => {\n      return Err(msg)\n    }\n  }\n}\n""", encoding='utf-8')
(server_app / 'src' / 'tlsutil.nb').write_text("""module tlsutil\nimport std::result\nimport tlsc::client\n\nfn trust_store_from_ca_pem_text_for_server(ca_pem: String) -> Result<TlsTrustStore, String> {\n  return trust_store_from_ca_pem_text(ca_pem)\n}\n""", encoding='utf-8')
(server_app / 'src' / 'main.nb').write_text(f"""module main
import server_handler
import service::config
import service::tls
import std::fs
import std::result
import tlsutil
import tlss::server

fn build_server_tls_config(ca_pem: String) -> Result<ServerConfig, String> {{
  let trust_store = trust_store_from_ca_pem_text_for_server(ca_pem)?
  let identity = server_identity_from_pem_text("{lit(server_cert)}", "{lit(server_key)}")?
  let tls_cfg0 = with_version_policy(server_config(identity), tls12_or_13_policy())
  let tls_cfg1 = with_alpn_policy(tls_cfg0, alpn_http11_only_policy())
  return Ok(with_client_auth_policy(tls_cfg1, required_client_auth(trust_store)))
}}

async fn main() -> Void {{
  match config_from_env("svc-tls-mtls-peer-identity", 0) {{
    Ok(cfg) => {{
      match build_server_tls_config("{lit(ca_pem)}") {{
        Ok(tls_cfg) => {{
          match await bind_tls_listener(cfg, tls_cfg) {{
            Ok(listener) => {{
              match write_string_atomic("{lit(str(ready_path))}", "ready") {{
                Ok(_) => {{
                  match await serve_requests_n_result_with_context_tls(listener, cfg, 1, handle_request) {{
                    Ok(_) => {{}}
                    Err(msg) => {{ print(msg) }}
                  }}
                }}
                Err(msg) => {{ print(msg) }}
              }}
            }}
            Err(msg) => {{ print(msg) }}
          }}
        }}
        Err(msg) => {{ print(msg) }}
      }}
    }}
    Err(msg) => {{ print(msg) }}
  }}
}}
""", encoding='utf-8')

(client_app / 'nebula.toml').write_text(f"""schema_version = 1\n\n[package]\nname = "official-service-tls-mtls-peer-identity-client-smoke"\nversion = "0.1.0"\nentry = "src/main.nb"\nsrc_dir = "src"\n\n[dependencies]\ntlsc = {{ path = "{repo_root / 'official' / 'nebula-tls'}" }}\n""", encoding='utf-8')
(client_app / 'src' / 'main.nb').write_text(f"""module main\nimport port_env\nimport std::http\nimport std::http_json\nimport std::json\nimport std::result\nimport tlsc::client\nimport tlsc::http\n\nfn build_client_config() -> Result<ClientConfig, String> {{\n  let base_cfg = client_config_from_ca_pem_text("{lit(ca_pem)}")?\n  let identity = client_identity_from_pem_text("{lit(client_cert)}", "{lit(client_key)}")?\n  let cfg0 = with_client_identity(base_cfg, identity)\n  let cfg1 = with_version_policy(cfg0, tls12_or_13())\n  return Ok(with_alpn_policy(cfg1, alpn_http11_only()))\n}}\n\nasync fn main() -> Void {{\n  match test_port_from_env() {{\n    Ok(port) => {{\n      match build_client_config() {{\n        Ok(cfg) => {{\n          match await dial_host("localhost", port, cfg) {{\n            Ok(stream) => {{\n              let request = get_request("localhost", "/whoami")\n              match await TlsClientStream_write_request(stream, request) {{\n                Ok(_) => {{\n                  match await TlsClientStream_read_response(stream) {{\n                    Ok(response) => {{\n                      match parse_json_body(response.body) {{\n                        Ok(body) => {{ print(stringify(body)) }}\n                        Err(msg) => {{ print(msg) }}\n                      }}\n                    }}\n                    Err(msg) => {{ print(msg) }}\n                  }}\n                }}\n                Err(msg) => {{ print(msg) }}\n              }}\n            }}\n            Err(msg) => {{ print(msg) }}\n          }}\n        }}\n        Err(msg) => {{ print(msg) }}\n      }}\n    }}\n    Err(msg) => {{ print(msg) }}\n  }}\n}}\n""", encoding='utf-8')

(client_app / 'src' / 'port_env.nb').write_text("""module port_env\nimport std::env\nimport std::result\n\nfn test_port_from_env() -> Result<Int, String> {\n  return get_int("NEBULA_TEST_PORT")\n}\n""", encoding='utf-8')

for app in (server_app, client_app):
    update = subprocess.run(
        [os.environ['NEBULA_BINARY'], 'update', str(app)],
        capture_output=True,
        text=True,
        env=os.environ.copy(),
    )
    print(update.stdout, end='')
    print(update.stderr, end='')
    if update.returncode != 0:
        raise SystemExit(update.returncode)

build_specs = (
    ('server', server_app, server_artifact_dir, server_artifact),
    ('client', client_app, client_artifact_dir, client_artifact),
)
build_processes = []
try:
    for label, app, out_dir, artifact in build_specs:
        build_proc, build_output = start_process(
            [
                os.environ['NEBULA_BINARY'],
                'build',
                str(app),
                '--out-dir',
                str(out_dir),
                '-o',
                str(artifact),
            ],
            f'mtls_{label}_build',
            env=os.environ.copy(),
            thread_name_prefix=f'mtls-{label}-build',
        )
        build_processes.append((label, artifact, build_proc, build_output))

    build_deadline = time.monotonic() + 100.0
    for label, artifact, build_proc, build_output in build_processes:
        remaining = build_deadline - time.monotonic()
        if remaining <= 0:
            fail_with_output(
                build_proc,
                build_output,
                f'{label} mTLS prebuild did not finish in time',
            )
        try:
            build_proc.wait(timeout=remaining)
        except subprocess.TimeoutExpired:
            fail_with_output(
                build_proc,
                build_output,
                f'{label} mTLS prebuild did not finish in time',
            )
        build_stdout, build_stderr = finish_process_output(
            build_proc, build_output
        )
        print(build_stdout, end='')
        print(build_stderr, end='')
        if build_proc.returncode != 0:
            raise SystemExit(
                f'{label} mTLS prebuild failed: rc={build_proc.returncode}'
            )
        if not artifact.is_file() or not Path(str(artifact) + '.nebmeta').is_file():
            raise SystemExit(
                f'{label} mTLS prebuild did not publish artifact and metadata'
            )
finally:
    for _, _, build_proc, build_output in reversed(build_processes):
        terminate_process(build_proc, build_output)

server_proc, server_output = start_process(
    [
        os.environ['NEBULA_BINARY'],
        'run',
        str(server_app),
        '--no-build',
        '-o',
        str(server_artifact),
        '--run-gate',
        'none',
    ],
    'listener_bound',
    env={
        **os.environ,
        'NEBULA_BIND_HOST': '127.0.0.1',
        'NEBULA_PORT': '0',
    },
)
try:
    _, bound_port = wait_for_listener_bound(
        server_proc,
        server_output,
        timeout=10.0,
        timeout_mode='exact',
    )
    ready_deadline = time.monotonic() + 5.0
    while True:
        if server_proc.poll() is not None:
            fail_with_output(
                server_proc,
                server_output,
                'mTLS server exited before publishing ready state',
            )
        try:
            ready_state = ready_path.read_text(encoding='utf-8')
        except FileNotFoundError:
            ready_state = None
        if ready_state == 'ready':
            break
        if ready_state is not None:
            fail_with_output(
                server_proc,
                server_output,
                f'mTLS server published unexpected ready state: {ready_state!r}',
            )
        if time.monotonic() >= ready_deadline:
            fail_with_output(
                server_proc,
                server_output,
                'mTLS server listener bound without publishing ready state',
            )
        time.sleep(0.01)

    try:
        client = run_contained_command(
            [
                os.environ['NEBULA_BINARY'],
                'run',
                str(client_app),
                '--no-build',
                '-o',
                str(client_artifact),
                '--run-gate',
                'none',
            ],
            cwd=Path.cwd(),
            shell=False,
            env={**os.environ, 'NEBULA_TEST_PORT': str(bound_port)},
            timeout_sec=20.0,
            containment_policy=ProcessContainmentPolicy.TRUSTED_COOPERATIVE,
            combine_stderr=False,
        )
    except InvocationError as exc:
        if exc.output:
            print(
                exc.output,
                end='' if exc.output.endswith('\n') else '\n',
                file=sys.stderr,
            )
        raise SystemExit(f'mTLS client containment failed: {exc}') from exc
    print(client.stdout, end='')
    print(client.stderr, end='')
    if client.timed_out:
        raise SystemExit('mTLS client did not finish in time')
    if not client.containment_complete:
        raise SystemExit('mTLS client containment did not reach its terminal oracle')
    if client.returncode != 0:
        raise SystemExit(client.returncode)
    lines = [line.strip() for line in client.stdout.splitlines() if line.strip().startswith('{')]
    if not lines:
        raise SystemExit(f'client did not emit JSON payload: {client.stdout!r}')
    payload = json.loads(lines[-1])
    if payload.get('subject') != 'CN=nebula-client':
        raise SystemExit(f'unexpected transport subject payload: {payload!r}')
    fingerprint = payload.get('fingerprint_sha256')
    if not isinstance(fingerprint, str) or len(fingerprint) != 64:
        raise SystemExit(f'unexpected fingerprint payload: {payload!r}')
    san_claims = payload.get('san_claims')
    if san_claims.get('dns_names') != ['client.local']:
        raise SystemExit(f'unexpected dns_names SAN claims: {payload!r}')
    if san_claims.get('ip_addresses') != ['10.1.2.3']:
        raise SystemExit(f'unexpected ip_addresses SAN claims: {payload!r}')
    if san_claims.get('email_addresses') != ['client@example.com']:
        raise SystemExit(f'unexpected email_addresses SAN claims: {payload!r}')
    if san_claims.get('uris') != ['spiffe://nebula/client']:
        raise SystemExit(f'unexpected uri SAN claims: {payload!r}')

    identity_debug = payload.get('identity_debug')
    if not isinstance(identity_debug, dict):
        raise SystemExit(f'missing identity_debug payload: {payload!r}')
    if identity_debug.get('subject') != 'CN=nebula-client':
        raise SystemExit(f'unexpected identity_debug subject: {payload!r}')
    if identity_debug.get('fingerprint_sha256') != fingerprint:
        raise SystemExit(f'identity_debug fingerprint drifted: {payload!r}')
    chain = identity_debug.get('chain')
    if not isinstance(chain, list) or len(chain) < 1:
        raise SystemExit(f'missing certificate chain snapshot: {payload!r}')
    leaf = chain[0]
    if leaf.get('index') != 0 or leaf.get('subject') != 'CN=nebula-client':
        raise SystemExit(f'unexpected certificate chain leaf payload: {payload!r}')
    if leaf.get('fingerprint_sha256') != fingerprint:
        raise SystemExit(f'certificate chain leaf fingerprint drifted: {payload!r}')
    if leaf.get('san_claims') != san_claims:
        raise SystemExit(f'certificate chain leaf SAN claims drifted: {payload!r}')

    principal = payload.get('principal')
    if not isinstance(principal, dict):
        raise SystemExit(f'missing principal payload: {payload!r}')
    if principal.get('subject') != 'CN=nebula-client' or principal.get('scheme') != 'mtls':
        raise SystemExit(f'unexpected principal payload: {payload!r}')
    if principal.get('fingerprint_sha256') != fingerprint:
        raise SystemExit(f'principal fingerprint drifted from transport fingerprint: {payload!r}')
    if principal.get('san_claims') != san_claims:
        raise SystemExit(f'principal SAN claims drifted from transport SAN claims: {payload!r}')
    if principal.get('identity_debug') != identity_debug:
        raise SystemExit(f'principal identity_debug drifted from transport identity_debug: {payload!r}')
finally:
    terminate_process(server_proc, server_output)

print('service-tls-mtls-peer-identity-ok')
PY
'''
expect_rc = 0
