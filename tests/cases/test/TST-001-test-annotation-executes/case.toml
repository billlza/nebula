id = "TST-001-test-annotation-executes"
suite = "test"

[[steps]]
kind = "shell"
run = "mkdir -p work/testdir && cp fixtures/smoke.nb work/testdir/smoke.nb"
expect_rc = 0

[[steps]]
kind = "nebula"
command = "test"
args = ["--diag-format", "json", "--dir", "work/testdir"]
expect_rc = 0
expect_stdout_contains = [
  "[test] test_add",
  "[test] ok",
  "test result: ok. 1 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out; finished in",
]
