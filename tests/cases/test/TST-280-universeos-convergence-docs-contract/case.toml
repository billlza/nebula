id = "TST-280-universeos-convergence-docs-contract"
suite = "test"

[[steps]]
kind = "shell"
run = '''
python3 - <<'PY'
import os
from pathlib import Path

repo = Path(os.environ["NEBULA_REPO_ROOT"])
doc = repo / "docs" / "universeos_convergence.md"
assessment = repo / "docs" / "universeos" / "readiness_assessment.md"
readme = repo / "README.md"
roadmap = repo / "ROADMAP.md"
app_platform = repo / "docs" / "app_platform_convergence.md"

text = doc.read_text(encoding="utf-8")
required = [
    "docs/universeos/readiness_assessment.md",
    "replaces percentage ranges",
    "not additive and are not a delivery estimate",
    "freestanding/no-std runtime profile",
    "traits/protocols or an equivalent model",
    "LLVM, Cranelift, or a direct object backend",
    "thin-host split",
    "direct object backend, linked image, QEMU boot, kernel, or supported OS substrate",
]
for needle in required:
    if needle not in text:
        raise SystemExit(f"missing UniverseOS convergence contract text: {needle}")

assessment_text = assessment.read_text(encoding="utf-8")
assessment_required = [
    "evidence ledger, not a delivery percentage or schedule",
    "ordinal within a row and must not be added",
    "No assessed capability is at candidate score 3",
    "There is no defensible single completion percentage",
    "Never average these rows into a product completion percentage or delivery date",
    "Revision basis:",
]
for needle in assessment_required:
    if needle not in assessment_text:
        raise SystemExit(f"missing UniverseOS readiness evidence boundary: {needle}")

for path in (readme, roadmap, app_platform):
    body = path.read_text(encoding="utf-8")
    if "docs/universeos_convergence.md" not in body:
        raise SystemExit(f"missing UniverseOS convergence link in {path}")

print("universeos-convergence-docs-ok")
PY
'''
expect_rc = 0
expect_stdout_contains = ["universeos-convergence-docs-ok"]
