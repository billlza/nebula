id = "TST-326-toolchain-profile-contract"
suite = "test"
description = "Nebula documents and verifies its installable toolchain component profile without claiming a rustup-style channel manager"

[[steps]]
kind = "shell"
run = """
python3 "$NEBULA_REPO_ROOT/scripts/verify_toolchain_profile.py" \
  --binary "$NEBULA_BINARY" \
  --out-root work/toolchain_profile
"""
expect_rc = 0
expect_stdout_contains = ["nebula-toolchain-profile-ok"]
