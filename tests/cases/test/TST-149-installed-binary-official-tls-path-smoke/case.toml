id = "TST-149-installed-binary-official-tls-path-smoke"
suite = "test"

[[steps]]
kind = "shell"
run = '''
python3 - <<'PY'
import hashlib
import os
import platform
import queue
import shutil
import socket
import ssl
import subprocess
import sys
import threading
from pathlib import Path

system = platform.system().lower()
if system.startswith('windows') or system.startswith('msys') or system.startswith('mingw') or system.startswith('cygwin'):
    print('installed-tls-skip-unsupported-host')
    raise SystemExit(0)
if shutil.which('openssl') is None:
    print('installed-tls-skip-missing-openssl')
    raise SystemExit(0)

repo_root = Path(os.environ['NEBULA_REPO_ROOT'])
root = Path('work/installed_tls')
release_root = Path('work/release_asset_tls')
install_root = Path('work/install-root-tls')
artifact_dir = root / 'build'
artifact = artifact_dir / 'installed-tls.out'
for path in (root, release_root, install_root):
    if path.is_symlink():
        path.unlink()
    elif path.exists():
        shutil.rmtree(path)
root.mkdir(parents=True, exist_ok=True)
release_root.mkdir(parents=True, exist_ok=True)

machine = platform.machine().lower()
if system == 'darwin' and machine in ('arm64', 'aarch64'):
    target = 'darwin-arm64'
elif system == 'darwin' and machine == 'x86_64':
    target = 'darwin-x86_64'
elif system == 'linux' and machine == 'x86_64':
    target = 'linux-x86_64'
else:
    raise SystemExit(f'unsupported host for installed TLS smoke: {system}/{machine}')

version = (repo_root / 'VERSION').read_text(encoding='utf-8').strip()
subprocess.run([
    'python3', str(repo_root / 'scripts' / 'package_release.py'),
    '--binary', os.environ['NEBULA_BINARY'],
    '--target', target,
    '--output-dir', str(release_root),
], check=True)
asset = next(release_root.glob('nebula-v*.tar.gz'))
h = hashlib.sha256()
with asset.open('rb') as fh:
    for chunk in iter(lambda: fh.read(1024 * 1024), b''):
        h.update(chunk)
(release_root / 'SHA256SUMS.txt').write_text(
    f'{h.hexdigest()}  {asset.name}\n', encoding='utf-8'
)
subprocess.run([
    'bash', str(repo_root / 'scripts' / 'install.sh'),
    '--version', version,
    '--prefix', str(install_root),
    '--base-url', str(release_root),
], check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
installed_nebula = install_root / 'bin' / 'nebula'

(root / 'openssl_ca.cnf').write_text("""[req]
distinguished_name = dn
x509_extensions = v3_ca
prompt = no

[dn]
CN = Installed TLS CA

[v3_ca]
subjectKeyIdentifier = hash
authorityKeyIdentifier = keyid:always,issuer
basicConstraints = critical, CA:true
keyUsage = critical, digitalSignature, keyCertSign, cRLSign
""", encoding='utf-8')
(root / 'openssl_server.cnf').write_text("""[req]
distinguished_name = dn
req_extensions = v3_req
prompt = no

[dn]
CN = localhost

[v3_req]
subjectAltName = @alt_names
basicConstraints = CA:false
keyUsage = critical, digitalSignature, keyEncipherment
extendedKeyUsage = serverAuth

[alt_names]
DNS.1 = localhost
IP.1 = 127.0.0.1
""", encoding='utf-8')
subprocess.run([
    'openssl', 'req', '-x509', '-newkey', 'rsa:2048', '-nodes',
    '-keyout', str(root / 'ca.key'),
    '-out', str(root / 'ca.pem'),
    '-days', '2',
    '-config', str(root / 'openssl_ca.cnf'),
], check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
subprocess.run([
    'openssl', 'req', '-newkey', 'rsa:2048', '-nodes',
    '-keyout', str(root / 'server.key'),
    '-out', str(root / 'server.csr'),
    '-config', str(root / 'openssl_server.cnf'),
], check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
subprocess.run([
    'openssl', 'x509', '-req',
    '-in', str(root / 'server.csr'),
    '-CA', str(root / 'ca.pem'),
    '-CAkey', str(root / 'ca.key'),
    '-CAcreateserial',
    '-out', str(root / 'server.pem'),
    '-days', '2',
    '-sha256',
    '-extfile', str(root / 'openssl_server.cnf'),
    '-extensions', 'v3_req',
], check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)

pkg = root / 'official' / 'nebula-tls'
app = root / 'app'
shutil.copytree(repo_root / 'official' / 'nebula-tls', pkg)
subprocess.run([
    str(installed_nebula), 'new', str(app)
], check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
ca_pem = (root / 'ca.pem').read_text(encoding='utf-8')
ca_literal = ca_pem.replace('\\', '\\\\').replace('\n', '\\n').replace('"', '\\"')

with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as server_socket:
    server_socket.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
    server_socket.bind(('127.0.0.1', 0))
    server_socket.listen(1)
    port = server_socket.getsockname()[1]

    (app / 'nebula.toml').write_text(f"""schema_version = 1

[package]
name = "installed-tls-app"
version = "0.1.0"
entry = "src/main.nb"
src_dir = "src"

[dependencies]
tls = {{ path = "{pkg.resolve()}" }}
""", encoding='utf-8')
    (app / 'src' / 'main.nb').write_text(f"""module main
import std::bytes
import std::net
import tls::client

async fn main() -> Void {{
  match client_config_from_ca_pem_text("{ca_literal}") {{
    Ok(config) => {{
      match ipv4("127.0.0.1", {port}) {{
        Ok(addr) => {{
          match await dial(addr, "localhost", config) {{
            Ok(stream) => {{
              match await stream.write_all(from_string("ping")) {{
                Ok(_) => {{
                  match await stream.read(128) {{
                    Ok(bytes) => {{
                      if to_string(bytes) == "tls-installed-ok" {{
                        print("installed-tls-ok")
                      }} else {{
                        print("installed-tls-bad")
                      }}
                    }}
                    Err(msg) => {{ print(msg) }}
                  }}
                }}
                Err(msg) => {{ print(msg) }}
              }}
              let _ = await stream.close()
            }}
            Err(msg) => {{ print(msg) }}
          }}
        }}
        Err(msg) => {{ print(msg) }}
      }}
    }}
    Err(msg) => {{ print(msg) }}
  }}
}}
""", encoding='utf-8')

    update = subprocess.run([
        str(installed_nebula), 'update', str(app)
    ], capture_output=True, text=True, env=os.environ.copy())
    print(update.stdout, end='')
    print(update.stderr, end='')
    if update.returncode != 0:
        raise SystemExit(update.returncode)

    build = subprocess.run([
        str(installed_nebula),
        'build',
        str(app),
        '--out-dir',
        str(artifact_dir),
        '-o',
        str(artifact),
    ], capture_output=True, text=True, env=os.environ.copy())
    print(build.stdout, end='')
    print(build.stderr, end='')
    if build.returncode != 0:
        raise SystemExit(build.returncode)

    done_q: queue.Queue[object] = queue.Queue()

    def serve() -> None:
        try:
            ctx = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
            ctx.load_cert_chain(str(root / 'server.pem'), str(root / 'server.key'))
            server_socket.settimeout(60)
            conn, _ = server_socket.accept()
            with ctx.wrap_socket(conn, server_side=True) as tls:
                tls.settimeout(60)
                data = tls.recv(4096)
                if data == b'ping':
                    tls.sendall(b'tls-installed-ok')
                else:
                    tls.sendall(b'bad:' + data)
            done_q.put(None)
        except Exception as exc:
            done_q.put(exc)

    thread = threading.Thread(target=serve, name='installed-tls-server', daemon=True)
    thread.start()
    try:
        try:
            run = subprocess.run([
                str(installed_nebula),
                'run',
                str(app),
                '--no-build',
                '-o',
                str(artifact),
                '--run-gate',
                'none',
            ], capture_output=True, text=True, env=os.environ.copy(), timeout=30)
        except subprocess.TimeoutExpired as exc:
            raise SystemExit('installed TLS client did not finish in time') from exc
        print(run.stdout, end='')
        print(run.stderr, end='')
        if run.returncode != 0:
            raise SystemExit(run.returncode)
        server_result = done_q.get(timeout=10)
        if server_result is not None:
            raise server_result
        if 'installed-tls-ok' not in run.stdout:
            raise SystemExit('installed-tls-ok missing from output')
    finally:
        if thread.is_alive():
            server_socket.close()
        thread.join(timeout=5)
        if thread.is_alive():
            detail = 'installed TLS server thread did not terminate'
            active_error = sys.exception()
            if active_error is None:
                raise RuntimeError(detail)
            active_error.add_note(detail)
PY
'''
expect_rc = 0
