id = "TST-230-official-tls-alpn-http11-fallback-smoke"
suite = "test"

[[steps]]
kind = "shell"
run = '''
python3 - <<'PY'
import json
import os
import platform
import shutil
import subprocess
import sys
import time
from pathlib import Path

system = platform.system().lower()
if system.startswith('windows') or system.startswith('msys') or system.startswith('mingw') or system.startswith('cygwin'):
    print('tls-alpn-http11-fallback-skip-unsupported-host')
    raise SystemExit(0)
if shutil.which('openssl') is None:
    raise SystemExit('openssl is required for official TLS ALPN fallback smoke test')

repo_root = Path(os.environ['NEBULA_REPO_ROOT'])
sys.path.insert(0, str(repo_root / 'tests' / 'lib'))
from service_probe import fail_with_output, finish_process_output, start_process, terminate_process

root = Path('work/official_tls_alpn_http11_fallback')
server_app = root / 'server_app'
client_app = root / 'client_app'
server_artifact_dir = root / 'server_build'
client_artifact_dir = root / 'client_build'
server_artifact = server_artifact_dir / 'tls-server.out'
client_artifact = client_artifact_dir / 'tls-client.out'
ready_path = root / 'server.ready'
if root.is_symlink():
    root.unlink()
elif root.exists():
    shutil.rmtree(root)
(server_app / 'src').mkdir(parents=True, exist_ok=True)
(client_app / 'src').mkdir(parents=True, exist_ok=True)
server_artifact_dir.mkdir(parents=True, exist_ok=True)
client_artifact_dir.mkdir(parents=True, exist_ok=True)

(root / 'openssl_ca.cnf').write_text("""[req]
distinguished_name = dn
x509_extensions = v3_ca
prompt = no

[dn]
CN = Nebula TLS HTTP11 Fallback CA

[v3_ca]
subjectKeyIdentifier = hash
authorityKeyIdentifier = keyid:always,issuer
basicConstraints = critical, CA:true
keyUsage = critical, digitalSignature, keyCertSign, cRLSign
""", encoding='utf-8')
(root / 'openssl_server.cnf').write_text("""[req]
distinguished_name = dn
req_extensions = v3_req
prompt = no

[dn]
CN = localhost

[v3_req]
subjectAltName = @alt_names
basicConstraints = CA:false
keyUsage = critical, digitalSignature, keyEncipherment
extendedKeyUsage = serverAuth

[alt_names]
DNS.1 = localhost
IP.1 = 127.0.0.1
""", encoding='utf-8')
subprocess.run([
    'openssl', 'req', '-x509', '-newkey', 'rsa:2048', '-nodes',
    '-keyout', str(root / 'ca.key'),
    '-out', str(root / 'ca.pem'),
    '-days', '2',
    '-config', str(root / 'openssl_ca.cnf'),
], check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
subprocess.run([
    'openssl', 'req', '-newkey', 'rsa:2048', '-nodes',
    '-keyout', str(root / 'server.key'),
    '-out', str(root / 'server.csr'),
    '-config', str(root / 'openssl_server.cnf'),
], check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
subprocess.run([
    'openssl', 'x509', '-req',
    '-in', str(root / 'server.csr'),
    '-CA', str(root / 'ca.pem'),
    '-CAkey', str(root / 'ca.key'),
    '-CAcreateserial',
    '-out', str(root / 'server.pem'),
    '-days', '2',
    '-sha256',
    '-extfile', str(root / 'openssl_server.cnf'),
    '-extensions', 'v3_req',
], check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)

server_cert = (root / 'server.pem').read_text(encoding='utf-8')
server_key = (root / 'server.key').read_text(encoding='utf-8')
ca_pem = (root / 'ca.pem').read_text(encoding='utf-8')

def lit(text: str) -> str:
    return text.replace('\\', '\\\\').replace('\n', '\\n').replace('"', '\\"')

(server_app / 'nebula.toml').write_text(f"""schema_version = 1

[package]
name = "official-tls-http11-fallback-server-smoke"
version = "0.1.0"
entry = "src/main.nb"
src_dir = "src"

[dependencies]
tlss = {{ path = "{repo_root / 'official' / 'nebula-tls-server'}" }}
""", encoding='utf-8')
(server_app / 'src' / 'main.nb').write_text(f"""module main
import std::fs
import std::http
import std::http_json
import std::json
import std::net
import tlss::server
import tlss::http

async fn main() -> Void {{
  match server_identity_from_pem_text("{lit(server_cert)}", "{lit(server_key)}") {{
    Ok(identity) => {{
      let cfg0 = with_version_policy(server_config(identity), tls13_only_policy())
      let cfg1 = with_alpn_policy(cfg0, alpn_http11_only_policy())
      let cfg2 = with_client_auth_policy(cfg1, disabled_client_auth())
      match await bind_host("127.0.0.1", 0, cfg2) {{
        Ok(listener) => {{
          match TlsListener_local_addr(listener) {{
            Ok(bound_addr) => {{
              match bound_addr.port() {{
                Ok(bound_port) => {{
                  match write_string("{lit(str(ready_path))}", stringify(int_value(bound_port))) {{
                    Ok(_) => {{}}
                    Err(msg) => {{ print(msg) }}
                  }}
                }}
                Err(msg) => {{ print(msg) }}
              }}
            }}
            Err(msg) => {{ print(msg) }}
          }}
          match await TlsListener_accept(listener) {{
            Ok(stream) => {{
              match await TlsServerStream_read_request(stream) {{
                Ok(request) => {{
                  let response = ok_json(object3(
                    "path",
                    string_value(request.path),
                    "alpn",
                    string_value(TlsServerStream_alpn_protocol(stream)),
                    "tls_version",
                    string_value(TlsServerStream_tls_version(stream))
                  ))
                  let write_result = await TlsServerStream_write_response_with_connection(stream, response, true)
                  let close_result = TlsListener_close(listener)
                  match write_result {{
                    Ok(_) => {{}}
                    Err(msg) => {{ print(msg) }}
                  }}
                  match close_result {{
                    Ok(_) => {{}}
                    Err(msg) => {{ print(msg) }}
                  }}
                }}
                Err(msg) => {{ print(msg) }}
              }}
            }}
            Err(msg) => {{ print(msg) }}
          }}
        }}
        Err(msg) => {{ print(msg) }}
      }}
    }}
    Err(msg) => {{ print(msg) }}
  }}
}}
""", encoding='utf-8')

(client_app / 'nebula.toml').write_text(f"""schema_version = 1

[package]
name = "official-tls-http11-fallback-client-smoke"
version = "0.1.0"
entry = "src/main.nb"
src_dir = "src"

[dependencies]
tlsc = {{ path = "{repo_root / 'official' / 'nebula-tls'}" }}
""", encoding='utf-8')
(client_app / 'src' / 'main.nb').write_text(f"""module main
import std::fs
import std::http
import std::http_json
import std::json
import std::result
import tlsc::client
import tlsc::http

fn read_server_port() -> Result<Int, String> {{
  let text = read_string("{lit(str(ready_path))}")?
  let value = parse(text)?
  return as_int(value)
}}

async fn main() -> Void {{
  match read_server_port() {{
    Ok(port) => {{
      match client_config_from_ca_pem_text("{lit(ca_pem)}") {{
        Ok(base_cfg) => {{
          let cfg0 = with_version_policy(base_cfg, tls13_only())
          let cfg1 = with_alpn_policy(cfg0, alpn_http11_or_http2())
          match await dial_host("localhost", port, cfg1) {{
            Ok(stream) => {{
              let request = get_request("localhost", "/hello")
              match await TlsClientStream_write_request(stream, request) {{
                Ok(_) => {{
                  match await TlsClientStream_read_response(stream) {{
                    Ok(response) => {{
                      match parse_json_body(response.body) {{
                        Ok(body) => {{
                          print(stringify(object3(
                            "status",
                            int_value(response.status),
                            "client_alpn",
                            string_value(TlsClientStream_alpn_protocol(stream)),
                            "response",
                            body
                          )))
                        }}
                        Err(msg) => {{ print(msg) }}
                      }}
                    }}
                    Err(msg) => {{ print(msg) }}
                  }}
                }}
                Err(msg) => {{ print(msg) }}
              }}
            }}
            Err(msg) => {{ print(msg) }}
          }}
        }}
        Err(msg) => {{ print(msg) }}
      }}
    }}
    Err(msg) => {{ print(msg) }}
  }}
}}
""", encoding='utf-8')

for app in (server_app, client_app):
    update = subprocess.run([
        os.environ['NEBULA_BINARY'], 'update', str(app)
    ], capture_output=True, text=True, env=os.environ.copy())
    print(update.stdout, end='')
    print(update.stderr, end='')
    if update.returncode != 0:
        raise SystemExit(update.returncode)

build_specs = (
    ('server', server_app, server_artifact_dir, server_artifact),
    ('client', client_app, client_artifact_dir, client_artifact),
)
build_processes = []
try:
    for label, app, out_dir, artifact in build_specs:
        proc, output = start_process([
            os.environ['NEBULA_BINARY'],
            'build',
            str(app),
            '--out-dir',
            str(out_dir),
            '-o',
            str(artifact),
        ], f'tls_{label}_build', env=os.environ.copy(), thread_name_prefix=f'tls-{label}-build')
        build_processes.append((label, artifact, proc, output))

    build_deadline = time.monotonic() + 110.0
    for label, artifact, proc, output in build_processes:
        remaining = build_deadline - time.monotonic()
        if remaining <= 0:
            fail_with_output(proc, output, f'{label} TLS prebuild did not finish in time')
        try:
            proc.wait(timeout=remaining)
        except subprocess.TimeoutExpired:
            fail_with_output(proc, output, f'{label} TLS prebuild did not finish in time')
        stdout, stderr = finish_process_output(proc, output)
        print(stdout, end='')
        print(stderr, end='')
        if proc.returncode != 0:
            raise SystemExit(proc.returncode)
        if 'NBL-PR001' in stdout or 'NBL-PR001' in stderr:
            raise SystemExit(f'{label} TLS prebuild emitted NBL-PR001')
        if not artifact.is_file() or not Path(str(artifact) + '.nebmeta').is_file():
            raise SystemExit(f'{label} TLS prebuild did not publish artifact and metadata')
finally:
    for _, _, proc, output in reversed(build_processes):
        terminate_process(proc, output)

server_proc, server_output = start_process([
    os.environ['NEBULA_BINARY'],
    'run',
    str(server_app),
    '--no-build',
    '-o',
    str(server_artifact),
    '--run-gate',
    'none',
], 'tls_http11_ready', env=os.environ.copy())
try:
    deadline = time.monotonic() + 30.0
    actual_port = None
    while time.monotonic() < deadline:
        if server_proc.poll() is not None:
            fail_with_output(
                server_proc,
                server_output,
                f'tls http11 fallback server exited before becoming ready: rc={server_proc.returncode}',
            )
        try:
            candidate = int(ready_path.read_text(encoding='utf-8').strip())
            if 1 <= candidate <= 65535:
                actual_port = candidate
                break
        except (FileNotFoundError, ValueError):
            pass
        time.sleep(0.1)
    if actual_port is None:
        fail_with_output(server_proc, server_output, 'tls http11 fallback server never became ready')

    try:
        client = subprocess.run([
            os.environ['NEBULA_BINARY'],
            'run',
            str(client_app),
            '--no-build',
            '-o',
            str(client_artifact),
            '--run-gate',
            'none',
        ], capture_output=True, text=True, env=os.environ.copy(), timeout=30)
    except subprocess.TimeoutExpired as exc:
        fail_with_output(server_proc, server_output, 'tls http11 fallback client did not finish')
    print(client.stdout, end='')
    print(client.stderr, end='')
    if client.returncode != 0:
        fail_with_output(
            server_proc,
            server_output,
            f'tls http11 fallback client failed: rc={client.returncode}',
        )
    if 'NBL-PR001' in client.stdout or 'NBL-PR001' in client.stderr:
        raise SystemExit('tls http11 fallback client emitted NBL-PR001')
    lines = [line.strip() for line in client.stdout.splitlines() if line.strip()]
    if not lines:
        raise SystemExit('tls http11 fallback client emitted no payload')
    payload = json.loads(lines[-1])
    if payload.get('status') != 200 or payload.get('client_alpn') != 'http/1.1':
        raise SystemExit(f'unexpected http11 fallback client payload: {payload!r}')
    response = payload.get('response')
    if not isinstance(response, dict):
        raise SystemExit(f'missing http11 fallback response payload: {payload!r}')
    if response.get('path') != '/hello' or response.get('alpn') != 'http/1.1' or response.get('tls_version') != 'TLSv1.3':
        raise SystemExit(f'unexpected http11 fallback response payload: {payload!r}')

    try:
        server_proc.wait(timeout=10)
    except subprocess.TimeoutExpired:
        fail_with_output(server_proc, server_output, 'tls http11 fallback server did not exit')
    stdout, stderr = finish_process_output(server_proc, server_output)
    print(stdout, end='')
    print(stderr, end='')
    if server_proc.returncode != 0:
        raise SystemExit(server_proc.returncode)
    if 'NBL-PR001' in stdout or 'NBL-PR001' in stderr:
        raise SystemExit('tls http11 fallback server emitted NBL-PR001')
finally:
    terminate_process(server_proc, server_output)

print('tls-alpn-http11-fallback-ok')
PY
'''
expect_rc = 0
