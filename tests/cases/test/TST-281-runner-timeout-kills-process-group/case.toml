id = "TST-281-runner-timeout-kills-process-group"
suite = "test"

[[steps]]
kind = "shell"
timeout = 5
expect_rc = 124
run = "python3 fixtures/runner_process_tree_probe.py timeout-start"
expect_stdout_contains = [
  "timeout-cleanup-child-started",
  "[nebula-test-timeout] command timed out after 5s",
]

[[steps]]
kind = "shell"
timeout = 10
run = "python3 fixtures/runner_process_tree_probe.py timeout-verify"
expect_stdout_contains = ["timeout-cleanup-ok"]

