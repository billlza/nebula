[[steps]]
kind = "shell"
run = """
python3 - <<'PY'
import json
import os
import sys
from pathlib import Path

repo_root = Path(os.environ['NEBULA_REPO_ROOT'])
sys.path.insert(0, str(repo_root / 'tests' / 'lib'))
from release_control_plane_workspace import (
    require_success,
    run_ctl,
    start_prebuilt_service,
    terminate_process,
    wait_until_health_ok,
)

binary = os.environ['NEBULA_BINARY']
root = Path('work/release_control_plane_dag_worker_readiness')
state_dir = root / 'state'
ctl_out = root / '.ctl-out'
proc, service_output, port = start_prebuilt_service(
    root / '.service-out' / 'main.out',
    {'APP_STATE_DIR': str(state_dir)},
)
try:
    wait_until_health_ok(proc, service_output, port)
    base_url = f'http://127.0.0.1:{port}'

    prewarm = run_ctl(
        binary,
        root,
        'control-plane-validate',
        '--url',
        base_url,
        out_dir=ctl_out,
        no_build=True,
    )
    require_success(prewarm, 'prebuilt ctl control-plane validation')

    config_put = run_ctl(binary, root, 'config', 'put', '--app', 'control-plane', '--channel', 'prod', '--key', 'feature.flag', '--bool', 'true', '--description', 'dag readiness', '--url', base_url, '--json', out_dir=ctl_out, no_build=True)
    require_success(config_put, 'config put')

    release_put = run_ctl(binary, root, 'release', 'put', '--app', 'control-plane', '--channel', 'prod', '--version', '2026.04.23', '--config-revision', '1', '--description', 'dag readiness', '--url', base_url, '--json', out_dir=ctl_out, no_build=True)
    require_success(release_put, 'release put')

    spec = root / 'workflow-dag.json'
    spec.write_text(json.dumps({
        'trigger_kind': 'internal_event',
        'event_kind': 'release_apply_requested',
        'stages': [
            {'name': 'approval', 'kind': 'approval_gate', 'task_kind': '', 'timeout_s': 0, 'max_attempts': 0, 'depends_on': []},
            {'name': 'apply-a', 'kind': 'leased_task', 'task_kind': 'apply_release', 'timeout_s': 30, 'max_attempts': 3, 'depends_on': ['approval']},
            {'name': 'apply-b', 'kind': 'leased_task', 'task_kind': 'apply_release', 'timeout_s': 30, 'max_attempts': 3, 'depends_on': ['approval']},
        ],
    }), encoding='utf-8')
    workflow_put = run_ctl(binary, root, 'workflow', 'put', '--app', 'control-plane', '--channel', 'prod', '--if-match', '1', '--spec-file', str(spec), '--url', base_url, '--json', out_dir=ctl_out, no_build=True)
    require_success(workflow_put, 'workflow put dag')

    approval = run_ctl(binary, root, 'approval', 'decide', '--app', 'control-plane', '--channel', 'prod', '--if-match', '1', '--decision', 'approved', '--reason', 'dag approved', '--url', base_url, '--json', out_dir=ctl_out, no_build=True)
    require_success(approval, 'approval decide')

    submit = run_ctl(binary, root, 'workflow', 'event', 'submit', '--app', 'control-plane', '--channel', 'prod', '--event-id', 'dag-event-1', '--event-kind', 'release_apply_requested', '--release-revision', '1', '--url', base_url, '--json', out_dir=ctl_out, no_build=True)
    require_success(submit, 'workflow event submit')
    run_payload = json.loads(submit.stdout)
    stages = run_payload.get('run', {}).get('meta', {}).get('stages', [])
    ready_names = [stage.get('stage_name') for stage in stages if stage.get('status') == 'ready']
    if ready_names != ['apply-a', 'apply-b']:
        raise SystemExit(f'expected both DAG sibling stages ready, got: {stages!r}')

    claim_a = run_ctl(binary, root, 'worker', 'claim', '--worker-id', 'worker-a', '--task-kind', 'apply_release', '--url', base_url, '--json', out_dir=ctl_out, no_build=True)
    require_success(claim_a, 'worker claim a')
    claim_a_payload = json.loads(claim_a.stdout)
    lease_a = claim_a_payload.get('lease', {})

    claim_b = run_ctl(binary, root, 'worker', 'claim', '--worker-id', 'worker-b', '--task-kind', 'apply_release', '--url', base_url, '--json', out_dir=ctl_out, no_build=True)
    require_success(claim_b, 'worker claim b')
    claim_b_payload = json.loads(claim_b.stdout)
    lease_b = claim_b_payload.get('lease', {})

    claimed_names = sorted([lease_a.get('stage_name'), lease_b.get('stage_name')])
    if claimed_names != ['apply-a', 'apply-b'] or lease_a.get('lease_id') == lease_b.get('lease_id'):
        raise SystemExit(f'DAG sibling claims were not distinct: {claim_a_payload!r} {claim_b_payload!r}')

    complete_a = run_ctl(binary, root, 'worker', 'complete', '--worker-id', 'worker-a', '--lease-id', lease_a.get('lease_id'), '--status', 'succeeded', '--message', 'a done', '--url', base_url, '--json', out_dir=ctl_out, no_build=True)
    require_success(complete_a, 'complete a')
    complete_b = run_ctl(binary, root, 'worker', 'complete', '--worker-id', 'worker-b', '--lease-id', lease_b.get('lease_id'), '--status', 'succeeded', '--message', 'b done', '--url', base_url, '--json', out_dir=ctl_out, no_build=True)
    require_success(complete_b, 'complete b')
    completed = json.loads(complete_b.stdout).get('run', {})
    if completed.get('meta', {}).get('status') != 'completed':
        raise SystemExit(f'DAG run did not complete: {completed!r}')
finally:
    terminate_process(proc, service_output)

print('release-control-plane-dag-worker-readiness-ok')
PY
"""
expect_rc = 0
expect_stdout_contains = ["release-control-plane-dag-worker-readiness-ok"]
